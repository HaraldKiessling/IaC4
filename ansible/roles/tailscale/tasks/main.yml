---
- name: Tailscale installieren
  ansible.builtin.shell: |
    curl -fsSL https://tailscale.com/install.sh | sh
  args:
    creates: /usr/bin/tailscale

- name: Tailscale-Auth-Key prüfen
  ansible.builtin.assert:
    that:
      - tailscale_auth_key is defined
      - tailscale_auth_key | length > 0
    fail_msg: "TAILSCALE_AUTH_KEY nicht gesetzt"

- name: Tailscale authentifizieren
  ansible.builtin.shell: |
    tailscale up --auth-key={{ tailscale_auth_key }} --hostname={{ inventory_hostname }} \
      --accept-routes={{ tailscale_accept_routes | default(true) | bool | ternary('true', 'false') }}
  register: ts_up_result
  changed_when: ts_up_result.rc == 0
  when: tailscale_auth_key is defined and tailscale_auth_key | length > 0

- name: Tailscale-Up-Ergebnis anzeigen (rc/stdout, ohne Auth-Key)
  ansible.builtin.debug:
    msg:
      - "rc: {{ ts_up_result.rc | default('n/a') }}"
      - "stdout: {{ ts_up_result.stdout | default('') }}"
  when: tailscale_auth_key is defined and tailscale_auth_key | length > 0

# Issue #135: accept-routes deklarativ + idempotent verankern. Kein Re-Join –
# setzt ausschließlich den Pref (auch für bereits laufende, gejointe Knoten).
# Gating wie der Join (nur mit Auth-Key), damit ein Lauf ohne Join unverändert bleibt.
- name: "accept-routes deklarativ sicherstellen (Issue #135)"
  ansible.builtin.include_tasks: accept-routes.yml
  when: tailscale_auth_key is defined and tailscale_auth_key | length > 0
  tags: [tailscale-accept-routes]
