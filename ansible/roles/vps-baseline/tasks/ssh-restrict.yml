---
# SSH-Restriction nach Tailscale-Join
# Phase 2: Public-SSH schließen, nur Tailscale-SSH erlauben
# Fix 2026-07-31: Interface-basiert, damit Tailscale-Interface offen bleibt

- name: Öffentliches Interface ermitteln
  ansible.builtin.set_fact:
    public_iface: "{{ ansible_default_ipv4.interface }}"

- name: SSH auf öffentlicher IP blockieren (nur public Interface)
  ansible.builtin.ufw:
    rule: deny
    port: '22'
    proto: tcp
    direction: in
    interface: "{{ public_iface }}"

- name: Prüfen ob SSH nur noch via Tailscale erreichbar
  ansible.builtin.wait_for:
    host: "{{ ansible_default_ipv4.address }}"
    port: 22
    state: stopped
    timeout: 10
  ignore_errors: yes
  when: tailscale_connected is defined and tailscale_connected
