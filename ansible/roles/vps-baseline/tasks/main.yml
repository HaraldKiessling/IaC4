---
- name: System aktualisieren
  ansible.builtin.apt:
    update_cache: yes
    upgrade: dist
    cache_valid_time: 3600

- name: Notwendige Pakete installieren
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - htop
      - ufw
      - unzip
      - fail2ban
    state: present

- name: requiretty für deploy-user deaktivieren (Pipelining)
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    state: present
    regexp: '^Defaults:deploy-user !requiretty'
    line: 'Defaults:deploy-user !requiretty'
    validate: 'visudo -cf %s'

- name: Swap einrichten
  ansible.builtin.shell: |
    if [ ! -f /swapfile ]; then
      fallocate -l 2G /swapfile
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
      echo '/swapfile none swap sw 0 0' >> /etc/fstab
    fi
  args:
    executable: /bin/bash

- name: Zeitzone einstellen
  ansible.builtin.shell: |
    timedatectl set-timezone Europe/Berlin
  args:
    executable: /bin/bash

- name: SSH-Konfiguration härten
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - { regexp: '^PermitRootLogin', line: 'PermitRootLogin prohibit-password' }
    - { regexp: '^PasswordAuthentication', line: 'PasswordAuthentication no' }
  notify: ssh restart
