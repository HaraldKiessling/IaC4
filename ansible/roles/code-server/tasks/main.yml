---
- name: Fail-Fast – Code-Server-Secrets vorhanden (keine Default-Credentials)
  ansible.builtin.assert:
    that:
      - code_server_password is string and code_server_password | length > 0 and code_server_password != 'changeme'
      - code_server_sudo_password is string and code_server_sudo_password | length > 0 and code_server_sudo_password != 'changeme'
    fail_msg: >-
      ❌ CODE_SERVER_PASSWORD / CODE_SERVER_SUDO_PASSWORD nicht gesetzt oder Platzhalter
      ('changeme'). Abbruch – kein Deploy mit Default-Credentials. GH-Secrets setzen
      und Workflow erneut starten.

- name: Code-Server-Verzeichnis anlegen
  ansible.builtin.file:
    path: /opt/code-server
    state: directory
    mode: '0755'

- name: Code-Server docker-compose.yml deployen
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/code-server/docker-compose.yml
    mode: '0644'

- name: Code-Server-Container starten
  community.docker.docker_compose_v2:
    project_src: /opt/code-server
    state: present
