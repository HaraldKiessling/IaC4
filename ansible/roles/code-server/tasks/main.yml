---
# Code-Server (Issue #65) – Fail-Fast gegen Default-Credentials, kein docker.sock,
# kein Host-Port-Publish; Erreichbarkeit nur via Traefik (web-EntryPoint, /code) + TS-TLS.

- name: Fail-Fast – Code-Server-Secrets vorhanden (keine Default-Credentials)
  ansible.builtin.assert:
    that:
      - code_server_password is string and code_server_password | length > 0 and code_server_password != 'changeme'
      - code_server_sudo_password is string and code_server_sudo_password | length > 0 and code_server_sudo_password != 'changeme'
    fail_msg: >-
      ❌ CODE_SERVER_PASSWORD / CODE_SERVER_SUDO_PASSWORD nicht gesetzt oder Platzhalter
      ('changeme'). Abbruch – kein Deploy mit Default-Credentials. GH-Secrets setzen
      und Workflow erneut starten.

- name: Code-Server-Verzeichnis anlegen
  ansible.builtin.file:
    path: /opt/code-server
    state: directory
    mode: '0755'

- name: Workspace-Host-Verzeichnis anlegen (frisch/leer auf DEV; uid 1000 = abc im Container)
  ansible.builtin.file:
    path: /workspace
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0755'

- name: Code-Server docker-compose.yml deployen (0600 – enthaelt PASSWORD/SUDO im Klartext, K4-1)
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/code-server/docker-compose.yml
    mode: '0600'

- name: Code-Server-Container starten
  community.docker.docker_compose_v2:
    project_src: /opt/code-server
    state: present

- name: Auf Code-Server warten (container-seitig, kein Host-Port-Publish)
  # Kein Host-Port-Mapping -> localhost:8443 vom Host NICHT erreichbar (Uri-Modul ungeeignet).
  # Health-Check im Container: /healthz (code-server-HTTP-Server) via docker exec.
  # LinuxServer-Images (Ubuntu-basiert, s6-overlay) bringen curl UND wget mit -> Fallback-Kette.
  ansible.builtin.shell: >-
    docker exec code-server sh -c
    'command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:8443/healthz
    || wget -qO- http://localhost:8443/healthz'
  register: _code_server_health
  until: _code_server_health.rc == 0
  retries: 20
  delay: 3
  changed_when: false
