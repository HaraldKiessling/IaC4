# IaC4 – DOCKER-USER-Regeln bei jedem Docker-Daemon-Start neu setzen (K2-3-Fix, 2026-07-31)
# Docker legt die DOCKER-USER-Kette bei jedem Daemon-Start neu an; ohne ExecStartPost
# wären die Ports nach einem Daemon-Restart bis zum nächsten Reboot ungeschützt.
[Service]
ExecStartPost=/usr/local/sbin/docker-user-cgnat.sh
