---
# Docker-Rolle (ADR-015: eigene Tasks + offizielles Docker-Repo; ADR-016: keine docker-Gruppe)
# Quellen: https://docs.docker.com/engine/install/ubuntu/ (deb822-Format, Stand 2026-07)

- name: Docker-Keyring-Verzeichnis anlegen
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Docker-GPG-Key herunterladen (docker.asc)
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Docker-APT-Repository deployen (deb822-Format)
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    mode: '0644'

- name: Docker-Engine + Compose-Plugin installieren
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Docker-Daemon aktivieren und starten
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: DOCKER-USER-CGNAT-Skript deployen (Firewall-Konzept R10/R11)
  ansible.builtin.copy:
    src: docker-user-cgnat.sh
    dest: /usr/local/sbin/docker-user-cgnat.sh
    mode: '0755'

- name: Drop-in-Verzeichnis anlegen (docker.service.d)
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: '0755'

- name: DOCKER-USER-Drop-in deployen (Regeln bei jedem Daemon-Start, K2-3)
  ansible.builtin.copy:
    src: docker-user-cgnat-dropin.conf
    dest: /etc/systemd/system/docker.service.d/docker-user-cgnat.conf
    mode: '0644'

- name: DOCKER-USER-Regeln sofort setzen (R10/R11, idempotent)
  ansible.builtin.command: /usr/local/sbin/docker-user-cgnat.sh
  register: docker_user_rules
  changed_when: docker_user_rules.rc == 0

# UFW: HA-PoC-Port 8123 aus CGNAT erlauben (additiv, F-C 2026-09-07)
# Owner-F-C 07.09. 03:04Z (Default-Umsetzung abgenommen): HA-PoC Staging/QS wird auf
# vps-dev UND vps-prod aus dem Tailnet auf 8123/tcp erreicht (Runner-Checks HTTP 401
# bestätigt; Freigabe lag bisher nur manuell/ad-hoc auf den Live-Hosts vor). Dieser
# Task verankert die 8123-CGNAT-Allow-Regel dauerhaft (Drift-/Reset-Schutz) auf beiden
# Targets: Playbook 03-docker-traefik.yml (hosts: vps) läuft je Target über Workflow 04
# (playbook=docker-traefik, target=dev|prod). Quellenbasiert wie Firewall-Konzept
# R4/R7-R9 (docs/plans/iac4-firewall-konzept.md); rein additiv - SSH-22-Regeln aus
# 02-ssh-restrict.yml und bestehende Port-Allows (80/8080 traefik, 11434 ollama)
# bleiben unverändert. Keine Tailscale-ACL-Änderung.
- name: UFW - Port 8123 aus CGNAT erlauben (HA-PoC Tailnet, F-C 2026-09-07)
  community.general.ufw:
    rule: allow
    from: 100.64.0.0/10
    port: 8123
    proto: tcp

# ADR-016: deploy-user wird BEWUSST nicht in die docker-Gruppe aufgenommen
# (docker-Gruppe = root-Äquivalent; Wartung via sudo, auditierbar).
# BDD-Check in scripts/bdd/docker-traefik.bdd.ps1 (Szenario D2).

- name: Shared Docker-Network erstellen ({{ docker_network }})
  community.docker.docker_network:
    name: "{{ docker_network }}"
    driver: bridge
    attachable: true
    state: present
