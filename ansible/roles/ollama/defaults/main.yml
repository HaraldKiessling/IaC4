---
# Ollama-Rolle – Defaults (ADR-021/022/023; group_vars SSoT, hier Fallbacks)
ollama_version: "0.32.5"
ollama_model: "nomic-embed-text"
ollama_cpu_limit: "2"
ollama_mem_limit: 4G
ollama_cpu_reserve: "1"
ollama_mem_reserve: 2G
ollama_num_parallel: 2
ollama_keep_alive: "24h"

docker_network: "traefik-network"   # Fallback (SSoT: group_vars/all.yml)
