---
# Einzelne OpenClaw-Instanz (oc = loop_var) – fail-safe Wrapper.
#
# Härtung 2026-10-05 (Runs 37282760139 / 37290260456 / 37294557038):
# Ein Fehler EINER Instanz (z. B. Health-Gate) brach bisher die include_tasks-Loop ab und
# übersprang alle Folge-Instanzen. Der per-Instanz-block/rescue sammelt das Ergebnis in
# openclaw_instance_results und lässt die Loop weiterlaufen; main.yml prüft am Ende per
# Aggregat-Assert fail-closed (Run rot bei JEDER ungesunden Instanz, aber alle Instanzen
# werden bearbeitet). Der eigentliche Instanz-Ablauf liegt in instance-body.yml.
- name: "{{ oc.name }}: Instanz-Ablauf (fail-safe, Folge-Instanzen laufen weiter)"
  block:
    - name: "{{ oc.name }}: Instanz-Schritte (Container, Install, Health, Serve)"
      ansible.builtin.include_tasks: instance-body.yml

    - name: "{{ oc.name }}: Ergebnis erfassen (gesund)"
      ansible.builtin.set_fact:
        openclaw_instance_results: >-
          {{ openclaw_instance_results | default([])
             + [ {'name': oc.name, 'port': oc.port, 'health': 'ok'} ] }}
  rescue:
    - name: "{{ oc.name }}: Ergebnis erfassen (fehlgeschlagen – Rest-Instanzen laufen weiter)"
      ansible.builtin.set_fact:
        openclaw_instance_results: >-
          {{ openclaw_instance_results | default([])
             + [ {'name': oc.name, 'port': oc.port, 'health': 'failed',
                  'task': ansible_failed_task.name | default('n/a'),
                  'msg': ansible_failed_result.msg | default(ansible_failed_result.stderr | default('n/a'))} ] }}
