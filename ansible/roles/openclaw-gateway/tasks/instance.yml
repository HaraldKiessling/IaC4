---
# Einzelne OpenClaw-Instanz (oc = loop_var)

- name: "{{ oc.name }}: Verzeichnisse anlegen"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ openclaw_data_root }}/{{ oc.name }}"
    - "{{ openclaw_data_root }}/{{ oc.name }}/config"
    - "{{ openclaw_data_root }}/{{ oc.name }}/workspace"

- name: "{{ oc.name }}: openclaw.json deployen (SSoT)"
  ansible.builtin.template:
    src: openclaw.json.j2
    dest: "{{ openclaw_data_root }}/{{ oc.name }}/config/openclaw.json"
    mode: '0600'

- name: "{{ oc.name }}: docker-compose.yml deployen (gepinnt, ADR-017)"
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ openclaw_data_root }}/{{ oc.name }}/docker-compose.yml"
    mode: '0644'

- name: "{{ oc.name }}: Container starten"
  community.docker.docker_compose_v2:
    project_src: "{{ openclaw_data_root }}/{{ oc.name }}"
    state: present
    pull: always

- name: "{{ oc.name }}: Auf Health warten (localhost:{{ oc.port }}/health)"
  ansible.builtin.uri:
    url: "http://localhost:{{ oc.port }}/health"
    status_code: 200
  register: _oc_health
  until: _oc_health.status == 200
  retries: 12
  delay: 5

- name: "{{ oc.name }}: Perplexity-Plugin installieren (idempotent, WebSearch)"
  ansible.builtin.shell: |
    docker exec openclaw-{{ oc.name }} openclaw plugins list 2>/dev/null | grep -q perplexity || \
      docker exec openclaw-{{ oc.name }} openclaw plugins install @openclaw/perplexity-plugin
  register: _oc_plugin
  changed_when: _oc_plugin.stdout | length > 0
  when: oc.websearch_api_key | default('') | length > 0

- name: "{{ oc.name }}: Tailscale Serve-Status (Idempotenz)"
  ansible.builtin.shell: tailscale serve status
  register: _serve_status
  changed_when: false
  failed_when: false

- name: "{{ oc.name }}: Tailscale Serve aktivieren (HTTPS {{ oc.port }} → localhost:{{ oc.port }})"
  ansible.builtin.command: tailscale serve --bg --https={{ oc.port }} http://localhost:{{ oc.port }}
  when: "'localhost:{{ oc.port }}' not in _serve_status.stdout"
  register: _serve_set
  changed_when: _serve_set.rc == 0
