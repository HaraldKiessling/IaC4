---
# OpenClaw-Gateway als Docker-Container (ADR-025 revidiert, 2026-08-01)
# Multi-Instanz: Loop über openclaw_instances. Pro Instanz: Container + Config + Workspace (Bind-Mounts),
# Port localhost-only, TLS-Terminierung via Tailscale Serve (--https=<port>), Netz traefik-network
# (Ollama/Qdrant via Docker-DNS: http://ollama:11434, http://qdrant:6333).
# Vorteil ggü. nativ: keine Host-Node/pnpm, keine ~/.openclaw-Altlasten (IaC3-Lesson), sauberer Reinstall.

- name: OpenClaw-Datenroot anlegen
  ansible.builtin.file:
    path: "{{ openclaw_data_root }}"
    state: directory
    mode: '0755'

# Ingress-Attribution (OpenClaw >= 2026.9.6): Gateway-authentifizierte Requests mit
# X-Forwarded-*-Headern von NICHT vertrauten Quellen werden fail-closed abgelehnt
# (HTTP 403, type=proxy_attribution_required).
# Ingress-Pfad der OpenClaw-Container: host-seitiges Tailscale Serve
# (tailscale serve --bg --https=<port> http://localhost:<port>) -> Docker-Portmap
# 127.0.0.1:<port>:<port> -> Container. Im Container ist der direkte Peer daher das
# Docker-Bruecken-Gateway von {{ docker_network }} (nicht Loopback). Genau diese eine
# Adresse (kein Subnetz) wird als trusted proxy eingetragen.
# Referenz: docs/gateway/tailscale.md ("Externally managed Serve and Funnel"),
#           docs/gateway/security/network-exposure.md ("Reverse proxy configuration").
- name: Docker-Netzwerk-Gateway ermitteln (trusted-proxy Quelle fuer den OpenClaw-Ingress)
  ansible.builtin.command:
    argv:
      - docker
      - network
      - inspect
      - "{{ docker_network }}"
      - --format
      - "{{ '{{(index .IPAM.Config 0).Gateway}}' }}"
  register: _oc_net_gw
  changed_when: false
  failed_when: false

- name: Trusted-Proxy-Liste fuer die Gateway-Config setzen (nur bei bekannter Gateway-Adresse)
  ansible.builtin.set_fact:
    oc_trusted_proxies: "{{ [_oc_net_gw.stdout | trim] }}"
  when: (_oc_net_gw.stdout | default('', true) | trim) | length > 0

- name: "Pro Instanz: Verzeichnisse, Config, Compose, Start, Install, Health, Serve"
  ansible.builtin.include_tasks: instance.yml
  loop: "{{ openclaw_instances }}"
  loop_control:
    loop_var: oc
  when:
    - oc.enabled | default(false)
    - openclaw_instance_filter == 'all' or oc.name == openclaw_instance_filter

# Härtung 2026-10-05 (fail-closed, aber kein Skip): Erwartete (enabled+gefilterte) Instanzen
# ableiten und den gesammelten openclaw_instance_results aus instance.yml dagegen pruefen.
- name: Erwartete Instanzen (enabled, ggf. Filter) ermitteln
  ansible.builtin.set_fact:
    openclaw_expected_instances: >-
      {{ (openclaw_instances | selectattr('enabled', 'defined') | selectattr('enabled')
          | map(attribute='name') | list)
         if openclaw_instance_filter == 'all'
         else ([openclaw_instance_filter]
               if (openclaw_instance_filter in (openclaw_instances | selectattr('enabled', 'defined')
                                                | selectattr('enabled') | map(attribute='name') | list))
               else []) }}

- name: "Aggregat-Assert – ALLE Instanzen bearbeitet, keine ungesund (fail-closed)"
  ansible.builtin.assert:
    that:
      - (openclaw_instance_results | default([]) | map(attribute='name') | list | sort)
        == (openclaw_expected_instances | sort)
      - (openclaw_instance_results | default([]) | selectattr('health', 'equalto', 'failed') | list | length) == 0
      - (openclaw_instance_filter == 'all') or (openclaw_expected_instances | length > 0)
    fail_msg: >-
      Deploy NICHT gruen. Erwartet/bearbeitet: {{ openclaw_expected_instances | join(', ') }} /
      {{ openclaw_instance_results | default([]) | map(attribute='name') | list | join(', ') }}.
      Ungesund: {{ openclaw_instance_results | default([]) | selectattr('health', 'equalto', 'failed')
                   | map(attribute='name') | list | join(', ') | default('keine', true) }}.
      {% if openclaw_instance_filter != 'all' and openclaw_expected_instances | length == 0 %}
      Filter '{{ openclaw_instance_filter }}' matched no active/enabled instances (Zero-Match).
      {% endif %}
      Details: {{ openclaw_instance_results | default([]) | selectattr('health', 'equalto', 'failed') | list }}.
    success_msg: >-
      Alle {{ openclaw_instance_results | default([]) | length }} Instanzen gesund:
      {{ openclaw_instance_results | default([]) | map(attribute='name') | list | join(', ') }}.
