---
# Qdrant (ADR-011) – gepinnt, HTTP-only; TLS-Terminierung via Tailscale Serve auf 6333
# (Entscheidung Harald 2026-08-01: NUR Tailscale terminiert TLS, Qdrant bleibt HTTP)
#
# Selbstheilung (Befund 2026-11-22, Prod): Der Container kann mit korrekter Compose-
# Config, aber ohne Netzwerkanbindung laufen (NetworkSettings.Networks = {}), z. B.
# wenn die gemeinsame Bridge ({{ docker_network }}) neu erstellt wurde. Dann fehlen
# Port-Publish (6333/6334) und Traefik-Anbindung; /healthz ist auf dem Host refused
# und der Tailscale-Serve-Proxy antwortet 502. Die Compose-Config-Hash ist dabei
# identisch zum Soll-Zustand – `docker_compose_v2 state=present` erkennt das NICHT.
# Deshalb unten: Zustandsprüfung + Entfernen des verwaisten Containers (Named Volume
# `qdrant-data` bleibt erhalten) vor dem Compose-Up.

- name: Qdrant-Verzeichnisse anlegen
  ansible.builtin.file:
    path: /opt/qdrant
    state: directory
    mode: '0755'

- name: Qdrant config.yaml deployen (Tuning aus IaC3 RFC 0011, kein TLS)
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /opt/qdrant/config.yaml
    mode: '0644'

- name: Qdrant docker-compose.yml deployen (gepinnt, traefik-network)
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/qdrant/docker-compose.yml
    mode: '0644'

- name: Qdrant-Container-Zustand abfragen (docker inspect, read-only)
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - "--format"
      - "{{ '{{' }}json .State{{ '}}' }}|{{ '{{' }}json .NetworkSettings.Networks{{ '}}' }}"
      - qdrant
  register: _qdrant_state
  changed_when: false
  failed_when: false

- name: "Befund: Qdrant-Container verwaist (nicht laufend oder ohne {{ docker_network }})"
  ansible.builtin.debug:
    msg: >-
      running={{ (_qdrant_state.stdout.split('|')[0] | from_json).Running | default(false) }},
      Netze={{ (_qdrant_state.stdout.split('|')[1] | from_json) | list }} –
      Container wird entfernt und durch Compose neu erstellt (Named Volume qdrant-data bleibt).
  when:
    - _qdrant_state.rc == 0
    - >-
      not ((_qdrant_state.stdout.split('|')[0] | from_json).Running | default(false) | bool)
      or docker_network not in (_qdrant_state.stdout.split('|')[1] | from_json)

- name: Verwaisten Qdrant-Container stoppen (Graceful, 30s)
  ansible.builtin.command: docker stop -t 30 qdrant
  when:
    - _qdrant_state.rc == 0
    - >-
      not ((_qdrant_state.stdout.split('|')[0] | from_json).Running | default(false) | bool)
      or docker_network not in (_qdrant_state.stdout.split('|')[1] | from_json)
  register: _qdrant_stop
  changed_when: _qdrant_stop.rc == 0
  failed_when: false

- name: Verwaisten Qdrant-Container entfernen (Named Volume qdrant-data bleibt erhalten)
  ansible.builtin.command: docker rm qdrant
  when:
    - _qdrant_state.rc == 0
    - >-
      not ((_qdrant_state.stdout.split('|')[0] | from_json).Running | default(false) | bool)
      or docker_network not in (_qdrant_state.stdout.split('|')[1] | from_json)
  register: _qdrant_rm
  changed_when: _qdrant_rm.rc == 0
  failed_when: _qdrant_rm.rc != 0

- name: Qdrant-Container starten (Compose, Soll-Netz + Port-Publish)
  community.docker.docker_compose_v2:
    project_src: /opt/qdrant
    state: present

- name: Qdrant-Container-Zustand nach Deploy pruefen (running + Netzwerk + Ports)
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - "--format"
      - "{{ '{{' }}json .State{{ '}}' }}|{{ '{{' }}json .NetworkSettings.Networks{{ '}}' }}|{{ '{{' }}json .NetworkSettings.Ports{{ '}}' }}"
      - qdrant
  register: _qdrant_state_after
  changed_when: false
  failed_when: >-
    _qdrant_state_after.rc != 0
    or not ((_qdrant_state_after.stdout.split('|')[0] | from_json).Running | default(false) | bool)
    or docker_network not in (_qdrant_state_after.stdout.split('|')[1] | from_json)
    or '6333/tcp' not in (_qdrant_state_after.stdout.split('|')[2] | from_json)

- name: Auf Qdrant warten (HTTP /healthz; /health existiert nicht → 404)
  ansible.builtin.uri:
    url: "http://localhost:6333/healthz"
    status_code: 200
  register: _qdrant_health
  until: _qdrant_health.status == 200
  retries: 10
  delay: 3

- name: Collection {{ qdrant_collection }} Zustand abfragen (read-only)
  ansible.builtin.uri:
    url: "http://localhost:6333/collections/{{ qdrant_collection }}"
    method: GET
    status_code: [200, 404]
  register: _qdrant_collection_pre
  changed_when: false

- name: Collection {{ qdrant_collection }} anlegen (nur wenn nicht vorhanden, 3072d/Cosine)
  ansible.builtin.uri:
    url: "http://localhost:6333/collections/{{ qdrant_collection }}"
    method: PUT
    headers:
      Content-Type: application/json
    body_format: json
    body:
      vectors:
        size: "{{ qdrant_collection_size }}"
        distance: "{{ qdrant_collection_distance }}"
    status_code: 200
  when: _qdrant_collection_pre.status == 404
  register: _qdrant_collection_put

- name: Collection-Konfiguration verifizieren (Dimension + Distance)
  ansible.builtin.uri:
    url: "http://localhost:6333/collections/{{ qdrant_collection }}"
    status_code: 200
  register: _qdrant_collection_get
  failed_when: >-
    _qdrant_collection_get.status != 200
    or (_qdrant_collection_get.json.result.config.params.vectors.size | int) != (qdrant_collection_size | int)
    or (_qdrant_collection_get.json.result.config.params.vectors.distance | string) != (qdrant_collection_distance | string)

- name: Tailscale Serve-Status abfragen (idempotenz)
  ansible.builtin.shell: tailscale serve status
  register: serve_status
  changed_when: false
  failed_when: false

- name: "Tailscale Serve aktivieren – HTTPS 6333 → localhost:6333 (TS-TLS-Terminierung)"
  ansible.builtin.command: tailscale serve --bg --https=6333 http://localhost:6333
  when: "'localhost:6333' not in serve_status.stdout"
  register: serve_set
  changed_when: serve_set.rc == 0

- name: "Tailscale Serve – TCP-Forward 6334 → tcp://localhost:6334 (gRPC, WG-verschluesselt)"
  ansible.builtin.command: tailscale serve --bg --tcp=6334 tcp://localhost:6334
  when: "'tcp://localhost:6334' not in serve_status.stdout"
  register: serve_set_grpc
  changed_when: serve_set_grpc.rc == 0
