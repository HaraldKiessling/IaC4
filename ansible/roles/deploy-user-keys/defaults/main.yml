---
# deploy-user-keys – Defaults
# SSoT für zusätzliche SSH-Pubkeys in authorized_keys von deploy-user:
# Liste `deploy_user_authorized_keys_extra` je Target in group_vars/vps-<target>.yml.
# Default leer → Rolle ist No-op auf Targets ohne Freigabe (additiv, nie destruktiv).
deploy_user_authorized_keys_extra: []
