---
# Traefik-Rolle (ADR-018: HTTP-only + Tailscale Serve; ADR-019: Dashboard sicher; ADR-020: Logging)
# Ersetzt den LE/Public-Bestand (arc42/05+07, P4-Delta ADR-018).

- name: Traefik-Verzeichnisse anlegen
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/traefik
    - /opt/traefik/config

- name: Tailscale-FQDN ermitteln (MagicDNS-Name, fuer Host-Rule)
  ansible.builtin.command: tailscale status --json
  register: _ts_status
  changed_when: false

- name: FQDN als Fakt setzen
  ansible.builtin.set_fact:
    traefik_fqdn: "{{ (_ts_status.stdout | from_json).Self.DNSName | trim('.') }}"

- name: Traefik-Static-Config deployen (HTTP-only, kein ACME)
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: /opt/traefik/traefik.yml
    mode: '0644'

- name: Traefik-Dynamic-Config deployen (Dashboard-Router + BasicAuth)
  ansible.builtin.template:
    src: config.yml.j2
    dest: /opt/traefik/config/config.yml
    mode: '0644'

- name: Traefik-docker-compose.yml deployen (gepinnt, json-file-Logging)
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/traefik/docker-compose.yml
    mode: '0644'

- name: UFW – Port 80 aus CGNAT erlauben (Firewall-Konzept R7, ADR-018)
  community.general.ufw:
    rule: allow
    from: 100.64.0.0/10
    port: 80
    proto: tcp

- name: UFW – Port 8080 aus CGNAT erlauben (Firewall-Konzept R8, ADR-019)
  community.general.ufw:
    rule: allow
    from: 100.64.0.0/10
    port: 8080
    proto: tcp

- name: Traefik-Container starten
  community.docker.docker_compose_v2:
    project_src: /opt/traefik
    state: present
  register: traefik_up

- name: Auf Traefik warten (Default-404 = bereit)
  ansible.builtin.uri:
    url: http://localhost:80/
    status_code: 404
  register: traefik_wait
  until: traefik_wait.status == 404
  retries: 10
  delay: 3

- name: "Tailscale Serve aktivieren (ADR-018: HTTPS 443 → localhost:80)"
  ansible.builtin.shell: tailscale serve status
  register: serve_status
  changed_when: false
  failed_when: false

- name: Tailscale Serve setzen (idempotent; Syntax >= 1.52, HTTPS:443 + Mount / sind Defaults)
  ansible.builtin.command: tailscale serve --bg http://localhost:80
  when: "'localhost:80' not in serve_status.stdout"
  register: serve_set
  changed_when: serve_set.rc == 0

# Serve strippt Mount-Prefixe beim Proxy (Tailscale-Doku) -> /dashboard-Mount lieferte "/" an Traefik -> 404.
# Dashboard laeuft stattdessen ueber den Root-Mount "/" -> localhost:80 mit Host-Rule (IaC3-Muster).
- name: "Tailscale Serve – /dashboard-Mount entfernen (Strip-Problem, Host-Rule-Ansatz)"
  ansible.builtin.command: tailscale serve --bg --set-path /dashboard off
  when: "'/dashboard' in serve_status.stdout"
  register: serve_off_dash
  changed_when: serve_off_dash.rc == 0

- name: "Tailscale Serve – /api-Mount entfernen (Strip-Problem, Host-Rule-Ansatz)"
  ansible.builtin.command: tailscale serve --bg --set-path /api off
  when: "'/api' in serve_status.stdout"
  register: serve_off_api
  changed_when: serve_off_api.rc == 0
