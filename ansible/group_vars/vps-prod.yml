---
env: prod

# OpenClaw-Instanzen PROD (Harald 2026-08-01: getrennt je Target deploybar)
# Secrets-Konvention: <TARGET>_<PROVIDER>_API_KEY (optional, NUR gesetzte Keys landen in der Config)
# Ollama braucht keinen Key (lokal, Docker-DNS); baseUrl-Override via PROD_OLLAMA_BASEURL optional
openclaw_provider_envs:
  deepseek: "PROD_DEEPSEEK_API_KEY"
  openrouter: "PROD_OPENROUTER_API_KEY"
  openai: "PROD_OPENAI_API_KEY"
  google: "PROD_GOOGLE_API_KEY"
  ollama: ""

openclaw_instances:
  - name: oc1
    enabled: true
    port: 18789
    label: "OC1 – Default Gateway (out of box)"
    llm_provider: deepseek            # aktiver Provider (Key Pflicht: PROD_DEEPSEEK_API_KEY)
    websearch_api_key_env: "PROD_OC1_WEBSEARCH_API_KEY"
    gateway_token_env: "PROD_OC1_GATEWAY_TOKEN"
    telegram_bot_token_env: "PROD_OC1_TELEGRAM_BOT_TOKEN"
    gh_token_env: "PROD_OC1_GH_TOKEN"
    agents: []
  - name: oc2
    enabled: true
    port: 18790
    label: "OC2 – DevOps Team (4 Agents)"
    llm_provider: deepseek
    websearch_api_key_env: "PROD_OC2_WEBSEARCH_API_KEY"
    gateway_token_env: "PROD_OC2_GATEWAY_TOKEN"
    telegram_bot_token_env: "PROD_OC2_TELEGRAM_BOT_TOKEN"
    gh_token_env: "PROD_OC2_GH_TOKEN"
    agents: [Orchestrator, Architect, "Engineer Pro", Reviewer]
  - name: oc3
    enabled: true
    port: 18791
    label: "OC3 – Best-Practice-Referenz (Benchmark, Design 01-oc2-oc3-benchmark)"
    llm_provider: deepseek
    websearch_api_key_env: "PROD_OC3_WEBSEARCH_API_KEY"
    gateway_token_env: "PROD_OC3_GATEWAY_TOKEN"
    telegram_bot_token_env: "PROD_OC3_TELEGRAM_BOT_TOKEN"
    gh_token_env: "PROD_OC3_GH_TOKEN"
    agents: [Orchestrator, Architect, "Engineer Pro", Reviewer]
    # Harald 2026-08-11: OC3 auf PROD freigeschaltet (Benchmark abgeschlossen).
    # Konfiguration identisch zu DEV-OC3 (Best-Practice-Referenz) – einzige
    # bewusste Abweichung: KEIN Memory-Seed (all.yml Default false, prod bleibt
    # vanilla – kein DEV-Wissen auf prod, Design 01 Z.65).
    agent_models:
      Orchestrator:
        primary: "deepseek/deepseek-v4-flash"
        fallbacks: ["deepseek/deepseek-v4-pro", "google/gemini-3.5-flash"]
      Architect:
        primary: "deepseek/deepseek-v4-pro"
        fallbacks: ["deepseek/deepseek-v4-flash"]
      "Engineer Pro":
        primary: "deepseek/deepseek-v4-flash"
        fallbacks: ["deepseek/deepseek-v4-pro"]
      Reviewer:
        primary: "deepseek/deepseek-v4-pro"
        fallbacks: ["deepseek/deepseek-v4-flash"]
    agent_thinking:
      Orchestrator: "medium"
      Architect: "high"
      "Engineer Pro": "medium"
      Reviewer: "high"
    subagents_defaults:
      delegationMode: "prefer"
      maxSpawnDepth: 2
      maxChildrenPerAgent: 5
      maxConcurrent: 4
      runTimeoutSeconds: 900
    subagents_allow_agents: ["orchestrator", "architect", "engineer-pro", "reviewer"]
    subagents_tools_deny: ["cron", "gateway"]
    agent_workspaces: true
