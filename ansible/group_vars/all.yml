---
# Globale Variablen (Ansible)
# Secrets werden via GH Actions Workflows als Extra-Vars (-e) oder env injiziert.
# lookup('env') hier als Fallback, wenn Variablen nicht explizit gesetzt sind.

docker_network: "traefik-network"   # ADR-018: LE/Public-Bestand ersetzt durch Tailscale-only

# Traefik (ADR-017/018/019) – HTTP-only, kein ACME; Auth via GH-Secret (Format: "user:<bcrypt-hash>")
traefik_version: "v3.7.9"           # Docker-Hub-Tag (Stand 2026-07-31) – maßgebliche Instanz ist Docker Hub, nicht GitHub Releases (ADR-017)

# Ollama (ADR-021/022/023) – erster Service
ollama_version: "0.32.5"            # Stand 2026-07-31 (GitHub Releases), Pinning ADR-017
ollama_model: "nomic-embed-text"    # ADR-023: nur ZooCode-Indexing; Qdrant bleibt 3072d (ADR-011)
ollama_model_dimensions: 768         # ADR-023: Dimensionen gekoppelt an Modell (Re-Index bei Wechsel)
ollama_cpu_limit: "2"
ollama_mem_limit: 4G
ollama_cpu_reserve: "1"
ollama_mem_reserve: 2G
ollama_num_parallel: 2        # ADR-022: parallele Embedding-Requests
ollama_keep_alive: "24h"      # ADR-022: Modell bleibt geladen (Zoo-Indexing-Fix)

# Qdrant (ADR-011) – gepinnt, TLS via Tailscale-Zertifikat (MagicDNS), HTTPS auf 6333
qdrant_version: "v1.18.3"           # Pin (DEV-Bestand 2026-08-01; prod-Upgrade bei Migration statt Downgrade)
qdrant_collection: "zoocode-3072d"  # RFC 0034b / #195 (prod-SSoT), 3072d/Cosine
qdrant_collection_size: 3072
qdrant_collection_distance: Cosine
qdrant_cert_dir: /opt/qdrant/certs

# Code-Server – Zugangsdaten (MÜSSEN via Extra-Vars oder GH Secrets gesetzt werden)
code_server_password: "{{ lookup('env', 'CODE_SERVER_PASSWORD') }}"
code_server_sudo_password: "{{ lookup('env', 'CODE_SERVER_SUDO_PASSWORD') }}"
code_server_hostname: "{{ lookup('env', 'CODE_SERVER_HOSTNAME') | default('code.example.com', true) }}"

# Tailscale – Auth (wird dynamisch im Workflow generiert)
tailscale_auth_key: "{{ lookup('env', 'TAILSCALE_AUTH_KEY') | default('', true) }}"

# OpenClaw – Multi-Instanz (ADR-025, revidiert 2026-08-01): Gateway als gepinnter Docker-Container
# pro Instanz: Container + Config-Volume + openclaw.json (SSoT). Ports localhost-only, TLS via Tailscale Serve.
# Secrets je Instanz als GH-Secrets: <INST>_TELEGRAM_BOT_TOKEN, <INST>_LLM_API_KEY, <INST>_WEBSEARCH_API_KEY
openclaw_image: "ghcr.io/openclaw/openclaw"
openclaw_image_version: "2026.7.1"          # Pin (ADR-017); Update = Variable + Deploy. GHCR-Tag bei Deploy verifizieren
# Agent-Modell-Matrix (Stand 2026-08-01, bisherige Instanz) – je Instanz referenzierbar
openclaw_agent_models:
  Orchestrator:
    primary: "deepseek/deepseek-v4-flash"
    fallbacks: ["deepseek/deepseek-v4-pro", "google/gemini-3.5-flash"]
  Architect:   # RFC-0040/IaC3-Konvention (N3); ID wird "architect"
    primary: "deepseek/deepseek-v4-pro"
    fallbacks: ["deepseek/deepseek-v4-flash", "google/gemini-3.5-flash"]
  "Engineer Pro":
    primary: "deepseek/deepseek-v4-flash"
    fallbacks: ["deepseek/deepseek-v4-pro", "google/gemini-3.5-flash"]
  Reviewer:
    primary: "deepseek/deepseek-v4-pro"
    fallbacks: ["deepseek/deepseek-v4-flash", "google/gemini-3.5-flash"]

# Instanz-Definitionen je Target: group_vars/vps-dev.yml (DEV_-Secrets) und vps-prod.yml (PROD_-Secrets)

# Provider-Modelle (Stand 2026-08-01, bisherige Instanz) – damit Agent-Matrix-Modelle existieren
openclaw_provider_models:
  deepseek:
    api: "openai-completions"
    baseUrl: "https://api.deepseek.com"
    models:
      - {id: "deepseek-v4-pro", name: "DeepSeek V4 Pro", reasoning: true, input: ["text"], contextWindow: 1048576, maxTokens: 384000}
      - {id: "deepseek-v4-flash", name: "DeepSeek V4 Flash", reasoning: true, input: ["text"], contextWindow: 1048576, maxTokens: 384000}
  openrouter:
    api: "openai-completions"
    baseUrl: "https://openrouter.ai/api/v1"
    models:
      - {id: "openrouter/auto", name: "OpenRouter Auto", reasoning: true, input: ["text", "image"], contextWindow: 200000, maxTokens: 8192}
  openai:
    api: "openai"
  google:
    api: "google-generative-ai"
    models:
      - {id: "gemini-3.5-flash", name: "Gemini 3.5 Flash", reasoning: true, input: ["text", "image"], contextWindow: 1048576, maxTokens: 65536}
      - {id: "gemini-embedding-2", name: "Gemini Embedding 2", reasoning: false, input: ["text"], contextWindow: 8192, maxTokens: 1}   # null invalid im Schema (Strict-Validation)
  ollama:
    api: "ollama"
    baseUrl: "http://ollama:11434"   # Docker-DNS im traefik-network
