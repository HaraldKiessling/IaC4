---
env: dev

# OpenClaw-Instanzen DEV (Harald 2026-08-01: getrennt je Target deploybar)
# Secrets-Konvention: <TARGET>_<PROVIDER>_API_KEY (optional, NUR gesetzte Keys landen in der Config)
# Ollama braucht keinen Key (lokal, Docker-DNS); baseUrl-Override via DEV_OLLAMA_BASEURL optional
openclaw_provider_envs:
  deepseek: "DEV_DEEPSEEK_API_KEY"
  openrouter: "DEV_OPENROUTER_API_KEY"
  openai: "DEV_OPENAI_API_KEY"
  google: "DEV_GOOGLE_API_KEY"
  ollama: ""

openclaw_instances:
  - name: oc1
    enabled: true
    port: 18789
    label: "OC1 – Creator/Vanilla-Baseline (Benchmark-Arm, Design 01-oc2-oc3-benchmark Kap. 6.1)"
    llm_provider: deepseek            # aktiver Provider (Key Pflicht: DEV_DEEPSEEK_API_KEY)
    websearch_api_key_env: "DEV_OC1_WEBSEARCH_API_KEY"
    gateway_token_env: "DEV_OC1_GATEWAY_TOKEN"
    telegram_bot_token_env: "DEV_OC1_TELEGRAM_BOT_TOKEN"
    gh_token_env: "DEV_OC1_GH_TOKEN"
    agents: []                        # bewusst KEINE Rollen-Agents (Single-Agent, Creator-These)
    # Konstant-Haltung wie OC2 (Design 01 Kap. 6.1): identische Timeouts/Concurrency
    # fuer alle 3 Benchmark-Arme – Timeout/Concurrency duerfen keine Variable sein.
    # Bewusst NICHT Doku-Defaults (maxConcurrent 8, runTimeout 0) – Abweichung dokumentiert.
    subagents_defaults:
      delegationMode: "suggest"      # Doku-Default, explizit (Creator: sparsame Delegation)
      maxSpawnDepth: 1               # Doku-Default, explizit (kein Orchestrator-Pattern)
      maxChildrenPerAgent: 5
      maxConcurrent: 4               # Konstante (identisch OC2/OC3)
      runTimeoutSeconds: 900         # Konstante (identisch OC2/OC3)
  - name: oc2
    enabled: true
    port: 18790
    label: "OC2 – DevOps Team (4 Agents) – Team-Replikat 1 (Design 06, PR #83)"
    llm_provider: deepseek
    websearch_api_key_env: "DEV_OC2_WEBSEARCH_API_KEY"
    gateway_token_env: "DEV_OC2_GATEWAY_TOKEN"
    telegram_bot_token_env: "DEV_OC2_TELEGRAM_BOT_TOKEN"
    gh_token_env: "DEV_OC2_GH_TOKEN"
    agents: [Orchestrator, Architect, "Engineer Pro", Reviewer]
    # Harald 2026-08-03: OC2 = NUR DeepSeek flash (alle 4 Agents).
    # Benchmark-Variable vs. OC3 = Modell-Mix (dort Arch+Rev pro).
    agent_models:
      Orchestrator:
        primary: "deepseek/deepseek-v4-flash"
        fallbacks: ["deepseek/deepseek-v4-pro", "google/gemini-3.5-flash"]
      Architect:
        primary: "deepseek/deepseek-v4-flash"
        fallbacks: ["deepseek/deepseek-v4-pro"]
      "Engineer Pro":
        primary: "deepseek/deepseek-v4-flash"
        fallbacks: ["deepseek/deepseek-v4-pro"]
      Reviewer:
        primary: "deepseek/deepseek-v4-flash"
        fallbacks: ["deepseek/deepseek-v4-pro"]
    # Reasoning (evidenzbasiert, 2026-08-03): T2-Befund Reasoning-Explosion bei flash
    # (64,7k Reasoning-Tokens, Latenz-Treiber) -> Orchestrator/Engineer Medium begrenzen.
    # DeepSeek-BP: Think High fuer Architektur/Review, Max nur Security-Audit.
    agent_thinking:
      Orchestrator: "medium"
      Architect: "high"
      "Engineer Pro": "medium"
      Reviewer: "high"
    subagents_defaults:
      delegationMode: "prefer"
      maxSpawnDepth: 2
      maxChildrenPerAgent: 5
      maxConcurrent: 4               # Konstante (identisch OC3)
      runTimeoutSeconds: 900         # Konstante (identisch OC3)
    subagents_allow_agents: ["orchestrator", "architect", "engineer-pro", "reviewer"]
    # Design 06 (PR #83): Per-Agent-Workspaces + Rollen-AGENTS.md
    # Tool-Scoping revidiert (14:45): Orchestrator braucht volle Tools als Pass-Through
    # (Vererbung an Kinder); Steuerung via AGENTS.md-Mandat (weich).
    agent_workspaces: true
  - name: oc3
    enabled: true
    port: 18791
    label: "OC3 – Best-Practice-Referenz (Benchmark, Design 01-oc2-oc3-benchmark)"
    llm_provider: deepseek
    websearch_api_key_env: "DEV_OC3_WEBSEARCH_API_KEY"
    gateway_token_env: "DEV_OC3_GATEWAY_TOKEN"
    telegram_bot_token_env: "DEV_OC3_TELEGRAM_BOT_TOKEN"
    gh_token_env: "DEV_OC3_GH_TOKEN"
    agents: [Orchestrator, Architect, "Engineer Pro", Reviewer]
    # Harald 2026-08-03: OC3-Modell-Mix — Orchestrator + Engineer = flash,
    # Reviewer + Architect = pro (Qualität dort, wo Analyse/Prüfung entscheidet).
    agent_models:
      Orchestrator:
        primary: "deepseek/deepseek-v4-flash"
        fallbacks: ["deepseek/deepseek-v4-pro", "google/gemini-3.5-flash"]
      Architect:
        primary: "deepseek/deepseek-v4-pro"
        fallbacks: ["deepseek/deepseek-v4-flash"]
      "Engineer Pro":
        primary: "deepseek/deepseek-v4-flash"
        fallbacks: ["deepseek/deepseek-v4-pro"]
      Reviewer:
        primary: "deepseek/deepseek-v4-pro"
        fallbacks: ["deepseek/deepseek-v4-flash"]
    # Reasoning (evidenzbasiert, 2026-08-03): DeepSeek-BP Think High fuer Architektur/Review,
    # Medium fuer Ausfuehrung (T2: Reasoning-Explosion = Latenz-Treiber).
    agent_thinking:
      Orchestrator: "medium"
      Architect: "high"
      "Engineer Pro": "medium"
      Reviewer: "high"
    # Orchestrator-Pattern (Design 01-oc2-oc3-benchmark Befund B3): Depth-2-Delegation + echte Rollen-IDs (B2)
    subagents_defaults:
      delegationMode: "prefer"
      maxSpawnDepth: 2
      maxChildrenPerAgent: 5
      maxConcurrent: 4               # Konstante (identisch OC2)
      runTimeoutSeconds: 900         # Konstante (identisch OC2)
    subagents_allow_agents: ["orchestrator", "architect", "engineer-pro", "reviewer"]
    # Design 06 (PR #83): Per-Agent-Workspaces + Rollen-AGENTS.md
    # Tool-Scoping-Entscheidung revidiert (14:45): agents.list[].tools am Orchestrator
    # vererbt sich auf Sub-Agents (Filterkette) -> Delegation kastriert. Orchestrator
    # braucht volle Tools als Pass-Through; Steuerung via AGENTS.md-Mandat (weich).
    agent_workspaces: true
    subagents_tools_deny: ["cron", "gateway"]
