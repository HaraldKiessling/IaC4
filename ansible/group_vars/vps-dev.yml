---
env: dev

# Memory-Seed aktiv (Design 06 K4-2): DEV-Benchmark-Arme indexieren den Seed
# (qmd-Backend + local memorySearch); prod bleibt vanilla (Default all.yml = false).
openclaw_memory_seed: true

# OpenClaw-Instanzen DEV (Harald 2026-08-01: getrennt je Target deploybar)
# Secrets-Konvention: <TARGET>_<PROVIDER>_API_KEY (optional, NUR gesetzte Keys landen in der Config)
# Ollama braucht keinen Key (lokal, Docker-DNS); baseUrl-Override via DEV_OLLAMA_BASEURL optional
openclaw_provider_envs:
  deepseek: "DEV_DEEPSEEK_API_KEY"
  openrouter: "DEV_OPENROUTER_API_KEY"
  openai: "DEV_OPENAI_API_KEY"
  google: "DEV_GOOGLE_API_KEY"
  ollama: ""

openclaw_instances:
  - name: oc1
    enabled: true
    port: 18789
    label: "OC1 – Creator/Vanilla-Baseline (Benchmark-Arm, Design 01-oc2-oc3-benchmark Kap. 6.1)"
    # OC1 = Vanilla-Baseline bleibt ohne Seed (User-Entscheidung 2026-08-05; Konzept v3.1 Frage 6 —
    # Benchmark-Stoervariable eliminiert; dev-oc2/oc3 behalten Seed via vps-dev.yml-Z.4-6)
    memory_seed: false               # Instanz-Override; Gate-Ausdruck instance.yml Z.141/153 wertet oc.memory_seed vor openclaw_memory_seed aus
    llm_provider: deepseek            # aktiver Provider (Key Pflicht: DEV_DEEPSEEK_API_KEY)
    websearch_api_key_env: "DEV_OC1_WEBSEARCH_API_KEY"
    gateway_token_env: "DEV_OC1_GATEWAY_TOKEN"
    telegram_bot_token_env: "DEV_OC1_TELEGRAM_BOT_TOKEN"
    gh_token_env: "DEV_OC1_GH_TOKEN"
    agents: []                        # bewusst KEINE Rollen-Agents (Single-Agent, Creator-These)
    # Fairness-Fix (2026-08-03, Kosten-Befund): OC1 lief auf pro (OpenClaw-Default =
    # erstes Provider-Modell). Alle 3 Arme jetzt modellgleich auf flash — einzige
    # Benchmark-Variable = Team-Setup (OC1: Single, OC2/OC3: Team).
    agent_models:
      Orchestrator:
        primary: "deepseek/deepseek-v4-flash"
        fallbacks: ["deepseek/deepseek-v4-pro", "google/gemini-3.5-flash"]
    # Konstant-Haltung wie OC2 (Design 01 Kap. 6.1): identische Timeouts/Concurrency
    # fuer alle 3 Benchmark-Arme – Timeout/Concurrency duerfen keine Variable sein.
    # Bewusst NICHT Doku-Defaults (maxConcurrent 8, runTimeout 0) – Abweichung dokumentiert.
    subagents_defaults:
      delegationMode: "suggest"      # Doku-Default, explizit (Creator: sparsame Delegation)
      maxSpawnDepth: 1               # Doku-Default, explizit (kein Orchestrator-Pattern)
      maxChildrenPerAgent: 5
      maxConcurrent: 4               # Konstante (identisch OC2/OC3)
      runTimeoutSeconds: 900         # Konstante (identisch OC2/OC3)
  - name: oc2
    enabled: true
    port: 18790
    label: "OC2 – DevOps Team (4 Agents) – Team-Replikat 1 (Design 06, PR #83)"
    llm_provider: deepseek
    websearch_api_key_env: "DEV_OC2_WEBSEARCH_API_KEY"
    gateway_token_env: "DEV_OC2_GATEWAY_TOKEN"
    telegram_bot_token_env: "DEV_OC2_TELEGRAM_BOT_TOKEN"
    gh_token_env: "DEV_OC2_GH_TOKEN"
    agents: [Orchestrator, Architect, "Engineer Pro", Reviewer]
    # Harald 2026-08-03: OC2 = NUR DeepSeek flash (alle 4 Agents).
    # Benchmark-Variable vs. OC3 = Modell-Mix (dort Arch+Rev pro).
    agent_models:
      Orchestrator:
        primary: "deepseek/deepseek-v4-flash"
        fallbacks: ["deepseek/deepseek-v4-pro", "google/gemini-3.5-flash"]
      Architect:
        primary: "deepseek/deepseek-v4-flash"
        fallbacks: ["deepseek/deepseek-v4-pro"]
      "Engineer Pro":
        primary: "deepseek/deepseek-v4-flash"
        fallbacks: ["deepseek/deepseek-v4-pro"]
      Reviewer:
        primary: "deepseek/deepseek-v4-flash"
        fallbacks: ["deepseek/deepseek-v4-pro"]
    # Reasoning (evidenzbasiert, 2026-08-03): T2-Befund Reasoning-Explosion bei flash
    # (64,7k Reasoning-Tokens, Latenz-Treiber) -> Orchestrator/Engineer Medium begrenzen.
    # DeepSeek-BP: Think High fuer Architektur/Review, Max nur Security-Audit.
    agent_thinking:
      Orchestrator: "medium"
      Architect: "high"
      "Engineer Pro": "medium"
      Reviewer: "high"
    subagents_defaults:
      delegationMode: "prefer"
      maxSpawnDepth: 2
      maxChildrenPerAgent: 5
      maxConcurrent: 4               # Konstante (identisch OC3)
      runTimeoutSeconds: 900         # Konstante (identisch OC3)
    subagents_allow_agents: ["orchestrator", "architect", "engineer-pro", "reviewer"]
    # Vergleichbarkeit (Harald 2026-08-03): Tool-/Rechte-Set identisch zu OC3 —
    # einzige Benchmark-Variable = Modell-Mix. Deny nur Control-Plane-Tools, die
    # OpenClaw Sub-Agents ohnehin via SUBAGENT_TOOL_DENY_ALWAYS sperrt (prod-unschädlich).
    subagents_tools_deny: ["cron", "gateway"]
    # Design 06 (PR #83): Per-Agent-Workspaces + Rollen-AGENTS.md
    # Tool-Scoping revidiert (14:45): Orchestrator braucht volle Tools als Pass-Through
    # (Vererbung an Kinder); Steuerung via AGENTS.md-Mandat (weich).
    agent_workspaces: true
  - name: oc3
    enabled: true
    port: 18791
    label: "OC3 – Best-Practice-Referenz (Benchmark, Design 01-oc2-oc3-benchmark)"
    llm_provider: deepseek
    websearch_api_key_env: "DEV_OC3_WEBSEARCH_API_KEY"
    gateway_token_env: "DEV_OC3_GATEWAY_TOKEN"
    telegram_bot_token_env: "DEV_OC3_TELEGRAM_BOT_TOKEN"
    gh_token_env: "DEV_OC3_GH_TOKEN"
    agents: [Orchestrator, Architect, "Engineer Pro", Reviewer]
    # Harald 2026-08-03: OC3-Modell-Mix — Orchestrator + Engineer = flash,
    # Reviewer + Architect = pro (Qualität dort, wo Analyse/Prüfung entscheidet).
    agent_models:
      Orchestrator:
        primary: "deepseek/deepseek-v4-flash"
        fallbacks: ["deepseek/deepseek-v4-pro", "google/gemini-3.5-flash"]
      Architect:
        primary: "deepseek/deepseek-v4-pro"
        fallbacks: ["deepseek/deepseek-v4-flash"]
      "Engineer Pro":
        primary: "deepseek/deepseek-v4-flash"
        fallbacks: ["deepseek/deepseek-v4-pro"]
      Reviewer:
        primary: "deepseek/deepseek-v4-pro"
        fallbacks: ["deepseek/deepseek-v4-flash"]
    # Reasoning (evidenzbasiert, 2026-08-03): DeepSeek-BP Think High fuer Architektur/Review,
    # Medium fuer Ausfuehrung (T2: Reasoning-Explosion = Latenz-Treiber).
    agent_thinking:
      Orchestrator: "medium"
      Architect: "high"
      "Engineer Pro": "medium"
      Reviewer: "high"
    # Orchestrator-Pattern (Design 01-oc2-oc3-benchmark Befund B3): Depth-2-Delegation + echte Rollen-IDs (B2)
    subagents_defaults:
      delegationMode: "prefer"
      maxSpawnDepth: 2
      maxChildrenPerAgent: 5
      maxConcurrent: 4               # Konstante (identisch OC2)
      runTimeoutSeconds: 900         # Konstante (identisch OC2)
    subagents_allow_agents: ["orchestrator", "architect", "engineer-pro", "reviewer"]
    # Design 06 (PR #83): Per-Agent-Workspaces + Rollen-AGENTS.md
    # Tool-Scoping-Entscheidung revidiert (14:45): agents.list[].tools am Orchestrator
    # vererbt sich auf Sub-Agents (Filterkette) -> Delegation kastriert. Orchestrator
    # braucht volle Tools als Pass-Through; Steuerung via AGENTS.md-Mandat (weich).
    agent_workspaces: true
    subagents_tools_deny: ["cron", "gateway"]
  - name: oc4
    enabled: true
    port: 18792              # nächster freier Port nach oc3=18791 (Betreiber-Entscheidung 2026-08-13 15:43)
    label: "OC4 – Familien-Instanz (Pilot, GH #126): 1 Gateway, geteilte LLM-Keys (S2), getrennter Speicher je Person (S3), eigener Telegram-Bot je Person (S4)"
    # #126 PILOT Familien-Instanz (oc4, dev): Eine Instanz, geteilte LLM-Keys (S2),
    # getrennter Speicher je Person (S3), eigener Telegram-Bot je Person (S4).
    # Konzept (aktuell): docs/arc42/07_verteilungssicht.md „OpenClaw oc4 – Familien-Instanz“
    # + docs/adr/ADR-025-openclaw-deployment.md; alte Konzept-Datei
    # iac4-pilot/konzept-pilot-oc1-dev.md (§3/§4) historisch (existiert nicht, keine Neuanlage).
    # Betreiber-Entscheidung 2026-08-13: oc1/oc2/oc3 (Benchmark-Arme) bleiben UNANGETASTET;
    # der Pilot läuft auf der NEUEN Instanz oc4 (Port 18792).
    # ⚠️ Q3 (Konzept §9 der historischen Datei, beantwortet 15:43): "person1"/"person2" sind gekennzeichnete PLATZHALTER-IDs,
    #    echte Personen + BotFather-Tokens sind NACHLIEFERBAR (Q3, Web-Oberfläche/Pairing/GH-Secrets).
    #    Tokens -> GH-Secrets DEV_OC4_TELEGRAM_BOT_PERSON1/PERSON2; Accounts + Bindings werden erst
    #    gerendert, wenn das jeweilige Token-Env gesetzt ist (gleiches Muster wie Provider-Keys;
    #    Gateway-Start failt nicht ohne Tokens).
    person_agents: ["person1", "person2"]      # Q3: echte Personen-IDs nach Lieferung ersetzen
    telegram_accounts:
      person1: "DEV_OC4_TELEGRAM_BOT_PERSON1"   # Q3: Token ausstehend (GH-Secret neu)
      person2: "DEV_OC4_TELEGRAM_BOT_PERSON2"   # Q3: Token ausstehend (GH-Secret neu)
    secrets_ref: true                            # Provider-Keys als SecretRef "${ENV}" statt Plaintext (S2/S6)
    # Pilot-Instanz: ohne Memory-Seed (kein Benchmark-Arm; Seed bleibt OC2/OC3-Variable)
    memory_seed: false               # Instanz-Override; Gate-Ausdruck instance.yml wertet oc.memory_seed vor openclaw_memory_seed aus
    llm_provider: deepseek            # aktiver Provider (Key Pflicht: DEV_DEEPSEEK_API_KEY, geteilt)
    # Web-Search oc4: OpenRouter statt Perplexity (Betreiber-Entscheidung 2026-08-13 17:00, #126).
    # Key (sk-or-...) als GH-Secret DEV_OC4_OPENROUTER_API_KEY; openclaw.json rendert SecretRef
    # "${DEV_OC4_OPENROUTER_API_KEY}" (oc.secrets_ref). Routing-Beleg: docs/tools/perplexity-search.md
    # „OpenRouter/Sonar-Kompatibilitaet“ – sk-or-Praefix -> OpenRouter-Chat-Completions-Pfad.
    websearch_api_key_env: "DEV_OC4_OPENROUTER_API_KEY"
    websearch_base_url: "https://openrouter.ai/api/v1"   # explizit (Determinismus K2)
    websearch_model: "perplexity/sonar-pro"              # explizit (Determinismus K2)
    gateway_token_env: "DEV_OC4_GATEWAY_TOKEN"
    telegram_bot_token_env: "DEV_OC4_TELEGRAM_BOT_TOKEN"
    gh_token_env: "DEV_OC4_GH_TOKEN"
    agents: []                        # #126 Pilot: Personen-Agents via person_agents (oben); keine Rollen-Agents
    agent_models:
      Orchestrator:
        primary: "deepseek/deepseek-v4-flash"
        fallbacks: ["deepseek/deepseek-v4-pro", "google/gemini-3.5-flash"]
    # #126 Pilot (S5): Orchestrator-Pattern pro Person – maxSpawnDepth 2 (Rollen-Sub-Agents
    # innerhalb der Person via allowAgents im Template); Timeout/Concurrency wie Benchmark-Konstanten.
    subagents_defaults:
      delegationMode: "prefer"      # Orchestrator-Pattern je Person (S5)
      maxSpawnDepth: 2              # Orchestrator-Pattern je Person (S5)
      maxChildrenPerAgent: 5
      maxConcurrent: 4
      runTimeoutSeconds: 900
