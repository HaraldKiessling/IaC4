---
- name: Phase 2b – SSH-Restrict nach Tailscale-Join
  hosts: vps
  become: true
  vars:
    tailscale_connected: true
  handlers:
    - name: sshd restart
      ansible.builtin.service:
        name: ssh
        state: restarted
  tasks:
    - name: Öffentliches Interface ermitteln
      ansible.builtin.set_fact:
        public_iface: "{{ ansible_default_ipv4.interface }}"

    - name: SSH aus Tailscale-Netz erlauben (CGNAT 100.64.0.0/10)
      ansible.builtin.ufw:
        rule: allow
        port: '22'
        proto: tcp
        direction: in
        from_ip: 100.64.0.0/10

    - name: SSH auf öffentlicher IP blockieren (nur public Interface)
      ansible.builtin.ufw:
        rule: deny
        port: '22'
        proto: tcp
        direction: in
        interface: "{{ public_iface }}"

    - name: Bestätigung
      ansible.builtin.debug:
        msg: "✅ SSH auf {{ public_iface }} blockiert. Tailscale-Interface bleibt offen."
