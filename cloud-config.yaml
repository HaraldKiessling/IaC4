#cloud-config
# IaC4 – VPS-Provisioning (fertig zum Einspielen)
# SSH-Key für GH Actions Deploy-User

users:
  - name: deploy-user
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: sudo
    shell: /bin/bash
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEkOYAaYV2j6PDXHAbND5BjkpTEeUZXcYp3zJ5H0gdbw iac4-deploy-key-20260730"

ssh_pwauth: false
disable_root: true
package_update: true

packages:
  - curl
  - wget
  - htop
  - unzip
  - ufw
  - tailscale

runcmd:
  # UFW: Nur SSH erlauben
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow ssh
  - ufw --force enable
  # Swap (2GB)
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - sysctl -w vm.swappiness=1
  # Tailscale aktivieren
  - systemctl enable --now tailscaled
