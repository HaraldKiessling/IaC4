# =============================================================================
# Standalone-Referenz (IaC3-Bestand) – NICHT die Deploy-Quelle.
# SSoT ist die Ansible-Rolle ansible/roles/code-server (Template docker-compose.yml.j2 +
# group_vars/all.yml): Image-Pin (code_server_version, ADR-017), Envs, Volumes, Labels,
# Netzwerkname. Deploy ausschließlich über Workflow 04-service-deploy.yml (Playbook 04-services.yml).
# =============================================================================
---
services:
  code-server:
    image: lscr.io/linuxserver/code-server:4.131.0-ls354
    container_name: code-server
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      # Wird via Ansible-Template gesetzt oder manuell überschreiben:
      - PASSWORD=${CODE_SERVER_PASSWORD:-changeme}
      - SUDO_PASSWORD=${CODE_SERVER_SUDO_PASSWORD:-changeme}
    volumes:
      - code-server-data:/config
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.code-server.rule=Host(`${CODE_SERVER_HOSTNAME:-code.example.com}`) && PathPrefix(`/code`)"
      - "traefik.http.routers.code-server.priority=100"
      - "traefik.http.middlewares.code-server-stripprefix.stripprefix.prefixes=/code"
      - "traefik.http.routers.code-server.middlewares=code-server-stripprefix"
      - "traefik.http.services.code-server.loadbalancer.server.port=8443"

volumes:
  code-server-data:

networks:
  traefik-network:
    external: true
