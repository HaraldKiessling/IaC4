---
version: '3.8'

services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      # Wird via Ansible-Template gesetzt oder manuell überschreiben:
      - PASSWORD=${CODE_SERVER_PASSWORD:-changeme}
      - SUDO_PASSWORD=${CODE_SERVER_SUDO_PASSWORD:-changeme}
    volumes:
      - code-server-data:/config
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.code-server.rule=Host(`${CODE_SERVER_HOSTNAME:-code.example.com}`)"
      - "traefik.http.services.code-server.loadbalancer.server.port=8443"

volumes:
  code-server-data:

networks:
  traefik-public:
    external: true
