---
version: '3.8'

# Hinweis: SSoT fuer den Deploy ist ansible/roles/qdrant (docker-compose.yml.j2).
# Diese Datei dient nur der lokalen Nachvollziehbarkeit und ist portgleich gehalten.
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    # Nur Loopback: tailscaled belegt auf prod 100.77.47.98%tailscale0:6333/6334
    # (Tailscale Serve). 0.0.0.0-Publish kollidiert damit (address already in use).
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - traefik-public

volumes:
  qdrant-data:

networks:
  traefik-public:
    external: true
