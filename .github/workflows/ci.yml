---
name: CI – Lint + Quality Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: 'docs/**/*.md'
      - name: Ansible Playbook Syntax-Check (P4b, K3-5)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ansible
          cd ansible
          FAIL=0
          for pb in playbooks/*.yml; do
            echo "▶️  $pb"
            ansible-playbook --syntax-check "$pb" >/dev/null 2>&1 || { echo "❌ $pb"; FAIL=1; }
          done
          if [ "$FAIL" -ne 0 ]; then echo "❌ Ansible-Syntax-Check fehlgeschlagen"; exit 1; fi
          echo "✅ Alle Playbooks syntaktisch valide"

      - name: OpenClaw-Templates rendern + validieren (K2-3)
        run: |
          python3 -m pip install --quiet pyyaml jinja2
          python3 scripts/validate-openclaw-templates.py

      - name: Check arc42 Living Docs (hart)
        run: |
          echo "Prüfe ob docs/arc42/ alle 12 Kapitel enthält…"
          FAIL=0
          for i in 01 02 03 04 05 06 07 08 09 10 11 12; do
            if ls docs/arc42/${i}_*.md >/dev/null 2>&1; then
              echo "  ✅ Kapitel $i"
            else
              echo "  ⚠️  Kapitel $i fehlt"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "❌ arc42 unvollständig – Living Docs pflegen (P4)"
            exit 1
          fi
