name: "03 – Tailscale OAuth-Client (erzeugen oder prüfen)"

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Neuen Client erstellen (alte manuell revoken in TS-UI)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  id-token: write

env:
  TF_VERSION: "1.11.0"

jobs:
  check:
    name: "Prüfen ob OAuth-Secrets existieren"
    runs-on: ubuntu-latest
    outputs:
      needs_creation: ${{ steps.check.outputs.needs_creation }}
    steps:
      - uses: actions/checkout@v4

      - name: Prüfen ob TAILSCALE_OAUTH_CLIENT_ID existiert
        id: check
        env:
          GH_TOKEN: *** secrets.GH_TOKEN }}
        run: |
          ID_EXISTS=$(gh secret list --repo ${{ github.repository }} --jq '[.[] | select(.name=="TAILSCALE_OAUTH_CLIENT_ID")] | length' 2>/dev/null || echo "0")
          SECRET_EXISTS=$(gh secret list --repo ${{ github.repository }} --jq '[.[] | select(.name=="TAILSCALE_OAUTH_CLIENT_SECRET")] | length' 2>/dev/null || echo "0")

          if [ "$ID_EXISTS" -gt 0 ] && [ "$SECRET_EXISTS" -gt 0 ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "✅ OAuth-Secrets existieren bereits. Überspringe (force=false)."
            echo "needs_creation=false" >> $GITHUB_OUTPUT
          else
            if [ "${{ github.event.inputs.force }}" == "true" ]; then
              echo "⚠️  force=true – Erstelle neuen Client"
              echo "🔴 Hinweis: Alter Client muss in Tailscale-UI (Trust credentials) manuell revokt werden!"
            else
              echo "🆕 OAuth-Secrets noch nicht vorhanden – erstelle..."
            fi
            echo "needs_creation=true" >> $GITHUB_OUTPUT
          fi

  create:
    name: "OAuth-Client via Terraform erstellen"
    needs: [check]
    if: needs.check.outputs.needs_creation == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/
    env:
      TF_IN_AUTOMATION: true
      TF_VAR_tailscale_api_key: ${{ secrets.TAILSCALE_API_KEY }}
      TF_VAR_tailscale_tailnet: ${{ secrets.TAILSCALE_TAILNET }}

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: OAuth-Secrets in GH speichern
        env:
          GH_TOKEN: *** secrets.GH_TOKEN }}
        run: |
          CLIENT_ID=$(terraform output -raw new_oauth_client_id 2>/dev/null)
          CLIENT_SECRET=*** output -raw new_oauth_client_secret 2>/dev/null)

          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "❌ Konnte OAuth-Credentials nicht aus Terraform-Output lesen"
            exit 1
          fi

          gh secret set TAILSCALE_OAUTH_CLIENT_ID \
            --body "$CLIENT_ID" \
            --repo ${{ github.repository }}

          gh secret set TAILSCALE_OAUTH_CLIENT_SECRET \
            --body "$CLIENT_SECRET" \
            --repo ${{ github.repository }}

          echo "✅ OAuth-Client erstellt und Secrets gespeichert"

      - name: Erfolgsmeldung
        run: |
          echo "✅ OAuth-Client bereit"
          echo "   GH Secrets aktualisiert: TAILSCALE_OAUTH_CLIENT_ID / _SECRET"
