name: "02 – Baseline Deploy (Phase 1)"

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Ziel-VPS'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  baseline:
    name: "Phase 1 – System-Baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_USER: ${{ secrets.VPS_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: SSH-Key vorbereiten
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "vps-${{ inputs.target }}.${{ secrets.TAILSCALE_TAILNET }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ansible installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ansible


      - name: Connect Runner to Tailnet (MagicDNS)
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Inventory-Datei erstellen (MagicDNS)
        run: |
          VPS_FQDN="vps-${{ inputs.target }}.${{ secrets.TAILSCALE_TAILNET }}"
          echo "[vps]" > /tmp/inventory
          echo "vps-${{ inputs.target }} ansible_host=${VPS_FQDN} ansible_user=$VPS_USER" >> /tmp/inventory
          cat /tmp/inventory

      - name: Phase 1 – Ansible Baseline ausführen
        working-directory: ansible
        run: |
          ansible-playbook playbooks/01-baseline.yml \
            -i /tmp/inventory

      - name: Post-Deploy Check (SSH via Tailscale)
        run: |
          echo "✅ Phase 1 abgeschlossen"
          echo "SSH-Verifikation via MagicDNS:"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
              "vps-${{ inputs.target }}.${{ secrets.TAILSCALE_TAILNET }}" \
              "hostname; tailscale ip -4" || echo "❌ SSH via MagicDNS fehlgeschlagen"
