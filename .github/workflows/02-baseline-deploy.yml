# =============================================================================
# 02 – Baseline Deploy — MUSS NACH 03 (Tailscale-Bootstrap) laufen!
#   Vorbedingung: Ziel-VPS hat Tailscale-IP (wird per API geprüft, sonst Abbruch).
#   Läuft über Tailscale (Public-IP ist nach 03 geschlossen).
# Siehe docs/workflows/deploy-stages.md
# =============================================================================
name: "02 – Baseline Deploy (Phase 1)"

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Ziel-VPS'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  baseline:
    name: "Phase 1 – System-Baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_USER: ${{ secrets.VPS_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Connect Runner to Tailnet (MagicDNS)
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Netmap-Sync abwarten
        run: sleep 15

      - name: VPS Tailscale-IP ermitteln (Tailscale-API)
        env:
          TS_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
          TS_API_KEY: ${{ secrets.TAILSCALE_API_KEY }}
        run: |
          NODE="vps-${{ inputs.target }}"
          TS_IP=$(curl -s \
            "https://api.tailscale.com/api/v2/tailnet/${TS_TAILNET}/devices?fields=hostname,addresses" \
            -H "Authorization: Bearer ${TS_API_KEY}" | jq -r --arg n "$NODE" '[.devices[] | select(.hostname == $n or .hostname == ($n + "-1"))] | sort_by(.lastSeen // "") | reverse | .[0].addresses[0] // empty' | head -1)
          if [ -z "$TS_IP" ] || [ "$TS_IP" = "null" ]; then
            echo "❌ Keine Tailscale-IP für Node ${NODE} gefunden."
            echo "   Vorbedingung nicht erfüllt: Workflow 03 (Tailscale-Bootstrap) muss zuerst laufen!"
            exit 1
          fi
          echo "VPS_TS_IP=${TS_IP}" >> $GITHUB_ENV
          echo "✅ Node ${NODE} → ${TS_IP}"

      - name: SSH-Key vorbereiten
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_TS_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ansible installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ansible


      - name: Inventory-Datei erstellen (MagicDNS)
        run: |
          echo "[vps]" > /tmp/inventory
          echo "vps-${{ inputs.target }} ansible_host=$VPS_TS_IP ansible_user=$VPS_USER" >> /tmp/inventory
          cat /tmp/inventory

      - name: Phase 1 – Ansible Baseline ausführen
        working-directory: ansible
        run: |
          ansible-playbook playbooks/01-baseline.yml \
            -i /tmp/inventory

      - name: Post-Deploy Check (SSH via Tailscale)
        run: |
          echo "✅ Phase 1 abgeschlossen"
          echo "SSH-Verifikation via MagicDNS:"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
              "$VPS_USER@$VPS_TS_IP" \
              "hostname; tailscale ip -4" || echo "❌ SSH via Tailscale fehlgeschlagen"
