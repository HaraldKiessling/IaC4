name: "02 – Tailscale Bootstrap (Phase 2a + 2b)"

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Ziel-VPS'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: write

jobs:
  tailscale-bootstrap:
    name: "Tailscale install + restrict SSH"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_PUBLIC_IP: ${{ secrets.VPS_DEV_PUBLIC_IP }}
      VPS_USER: ${{ secrets.VPS_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
    
    steps:
      - uses: actions/checkout@v4

      - name: SSH-Key vorbereiten
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_PUBLIC_IP" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ansible installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ansible

      - name: Phase 2a – Tailscale installieren & joinen
        run: |
          ansible-playbook ansible/playbooks/02-tailscale.yml \
            -i "$VPS_PUBLIC_IP," \
            -u "$VPS_USER" \
            --private-key ~/.ssh/id_ed25519 \
            -e "ansible_host=$VPS_PUBLIC_IP"
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_PRE_AUTH_KEY }}
        continue-on-error: yes

      - name: Phase 2b – SSH-Restrict (UFW deny 22)
        run: |
          ansible-playbook ansible/playbooks/02-ssh-restrict.yml \
            -i "$VPS_PUBLIC_IP," \
            -u "$VPS_USER" \
            --private-key ~/.ssh/id_ed25519
        continue-on-error: yes

      - name: Bestätigung
        run: |
          echo "✅ Tailscale installiert und SSH auf Public-IP blockiert"
          echo "VPS jetzt nur noch via Tailscale erreichbar:"
          echo "  ssh $VPS_USER@vps-${{ inputs.target }}.tailcfea8a.ts.net"
