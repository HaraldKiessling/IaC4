---
# =============================================================================
# 02b – Tailscale accept-routes (Issue #135) — On-Demand, KEIN Re-Join
#
#   Setzt nur den Client-Pref `--accept-routes` auf vps-dev/vps-prod.
#   Läuft über Tailscale (die Public-IP ist nach Workflow 02 / Phase 2b
#   geschlossen). Der Runner joint nur zum Ausführen ins Tailnet; auf dem VPS
#   wird NICHT neu gejoint (kein `tailscale up`, kein Auth-Key, kein Neustart).
#
#   Reihenfolge: erst `mode=check` (Dry-Run, --check --diff) → Wirkung prüfen,
#   dann `mode=apply` (nur mit confirm=APPLY-ACCEPT-ROUTES).
#
#   PROD-REGEL (Owner): Ein `mode=apply` auf `target=prod` wird vom OWNER
#   ausgeführt (Harald). Der Workflow erzwingt die Bestätigung
#   confirm=APPLY-ACCEPT-ROUTES; empfohlen zusätzlich: GitHub Environment mit
#   Required Reviewer für prod (Repo-Setting, nicht Teil dieses PRs).
#
#   KEIN push/PR/schedule-Trigger – ausschließlich manuell (workflow_dispatch).
#   Siehe docs/workflows/tailscale-accept-routes-runbook.md
# =============================================================================
name: "02b – Tailscale accept-routes (Issue #135, ohne Re-Join)"

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Ziel-VPS'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      mode:
        description: 'check = Dry-Run (--check --diff, kein Schreiben); apply = setzen'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - apply
      confirm:
        description: 'Nur für apply erforderlich: exakt APPLY-ACCEPT-ROUTES'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  accept-routes:
    name: "accept-routes (target=${{ inputs.target }}, mode=${{ inputs.mode }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_USER: ${{ secrets.VPS_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: "(1) Governance-Guard – mode/confirm"
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$MODE" in
            check|apply) ;;
            *) echo "::error::Ungültiger mode='$MODE' (erlaubt: check|apply)"; exit 1 ;;
          esac
          if [ "$MODE" = "apply" ] && [ "$CONFIRM" != "APPLY-ACCEPT-ROUTES" ]; then
            echo "::error::apply verlangt confirm='APPLY-ACCEPT-ROUTES' (Owner-Go)."
            exit 1
          fi
          echo "✅ Guard ok (target=${{ inputs.target }}, mode=$MODE, actor=${{ github.actor }})"

      - name: "(2) Vorbedingungen prüfen"
        env:
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          TS_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
        run: |
          set -euo pipefail
          FAIL=0
          [ -n "$SSH_KEY" ] || { echo "❌ Secret SSH_KEY fehlt"; FAIL=1; }
          [ -n "$VPS_USER" ] || { echo "❌ Secret VPS_USER fehlt"; FAIL=1; }
          [ -n "$TS_CLIENT_ID" ] || { echo "❌ Secret TAILSCALE_OAUTH_CLIENT_ID fehlt"; FAIL=1; }
          [ -n "$TS_CLIENT_SECRET" ] || { echo "❌ Secret TAILSCALE_OAUTH_CLIENT_SECRET fehlt"; FAIL=1; }
          [ -n "$TS_TAILNET" ] || { echo "❌ Secret TAILSCALE_TAILNET fehlt"; FAIL=1; }
          [ "$FAIL" -eq 0 ] || { echo "❌ Vorbedingungen nicht erfüllt – Abbruch"; exit 1; }
          echo "✅ Vorbedingungen ok"

      - name: "(3) Runner ins Tailnet (MagicDNS)"
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci,tag:ia4

      - name: "(4) Netmap-Sync abwarten"
        run: sleep 15

      - name: "(5) Tailscale OAuth-Token holen (IaC3-Verfahren)"
        env:
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          TS_TOKEN=$(curl -s --max-time 30 --data-urlencode "client_id=$TS_CLIENT_ID" \
            --data-urlencode "client_secret=$TS_CLIENT_SECRET" \
            "https://api.tailscale.com/api/v2/oauth/token" | jq -r '.access_token')
          echo "::add-mask::${TS_TOKEN}"
          echo "TS_TOKEN=${TS_TOKEN}" >> "$GITHUB_ENV"

      - name: "(6) VPS Tailscale-IP ermitteln (Tailscale-API)"
        env:
          TS_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
        run: |
          set -euo pipefail
          NODE="vps-${{ inputs.target }}"
          API_RESP=$(curl -sS -w "\nHTTP_CODE:%{http_code}" \
            "https://api.tailscale.com/api/v2/tailnet/${TS_TAILNET}/devices?fields=hostname,addresses" \
            -H "Authorization: Bearer ${TS_TOKEN}")
          HTTP_CODE=$(printf '%s' "$API_RESP" | tail -1 | cut -d: -f2)
          API_BODY=$(printf '%s' "$API_RESP" | sed '$d')
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ API-Fehler (HTTP ${HTTP_CODE}):"
            printf '%s\n' "$API_BODY" | head -5
            exit 1
          fi
          TS_IP=$(printf '%s' "$API_BODY" | jq -r --arg n "$NODE" \
            '[.devices[] | select(.hostname == $n or .hostname == ($n + "-1"))] | sort_by(.lastSeen // "") | reverse | .[0].addresses[0] // empty' | head -1)
          if [ -z "$TS_IP" ] || [ "$TS_IP" = "null" ]; then
            echo "❌ Keine Tailscale-IP für Node ${NODE} gefunden (Node nicht gejoint?)."
            exit 1
          fi
          echo "VPS_TS_IP=${TS_IP}" >> "$GITHUB_ENV"
          echo "✅ ${NODE} → ${TS_IP}"

      - name: "(7) SSH-Key vorbereiten"
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_TS_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: "(8) Ansible installieren"
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ansible

      - name: "(9) Inventory-Datei erstellen (Tailscale-IP)"
        run: |
          set -euo pipefail
          printf '[vps]\n%s ansible_host=%s ansible_user=%s\n' \
            "vps-${{ inputs.target }}" "$VPS_TS_IP" "$VPS_USER" > /tmp/inventory
          cat /tmp/inventory

      - name: "(10) accept-routes – Dry-Run (--check --diff, immer)"
        working-directory: ansible
        run: |
          set -euo pipefail
          ansible-playbook playbooks/tailscale-accept-routes.yml \
            -i /tmp/inventory --check --diff

      - name: "(11) accept-routes – Apply (nur mode=apply)"
        if: inputs.mode == 'apply'
        working-directory: ansible
        run: |
          set -euo pipefail
          echo "⚠️  Owner-Go bestätigt (confirm=APPLY-ACCEPT-ROUTES, target=${{ inputs.target }})."
          ansible-playbook playbooks/tailscale-accept-routes.yml \
            -i /tmp/inventory

      - name: "(12) Verifikation (Ist-Zustand via Tailscale-SSH)"
        run: |
          set -euo pipefail
          echo "--- accept-routes Ist-Wert (via Tailscale-SSH):"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_TS_IP" \
            "tailscale get accept-routes; tailscale ip -4"
          echo "✅ Fertig. Bei mode=check wurde nichts geschrieben."
