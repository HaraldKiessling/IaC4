# =============================================================================
# Diagnose – Tailscale Serve (read-only)
#
# Liest die LIVE registrierten Tailscale-Serve-Routen eines Ziel-VPS aus.
# Nur `tailscale serve status --json` + `tailscale serve status` – KEIN --bg,
# KEIN reset, KEIN Deploy, keine Host-Änderung. Kontext: Issue #167
# (Browser-Relay OC3 :18791 reconnectet zyklisch; Verdacht stale/doppelter Handler).
#
# Manuell startbar via workflow_dispatch (target: dev|prod, Default prod).
# Zusätzlich: push auf den `dev`-Branch → Diagnose fest gegen vps-dev (NICHT prod).
#   Begründung: autonomer Push-Trigger für DEV-Diagnosen ohne manuellen Dispatch.
#
# Robustheit (2026-10-04): OAuth-Token mit Retry + sichtbarem HTTP-Code;
#   Geräte-Lookup mit HTTP-Code-Diagnose; MagicDNS-FQDN-Fallback (Runner ist im
#   Tailnet), damit die read-only Diagnose auch bei API-Ausfall durchläuft.
# =============================================================================
name: "Diagnose – Tailscale Serve (read-only)"

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Ziel-VPS'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - prod
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  diagnose-serve:
    name: "Tailscale Serve Status (target: ${{ github.event_name == 'push' && 'dev' || inputs.target }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # push-Trigger ist fest auf dev gepinnt; workflow_dispatch nutzt die Eingabe.
      TARGET: ${{ github.event_name == 'push' && 'dev' || inputs.target }}
      VPS_USER: ${{ secrets.VPS_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Vorbedingungen prüfen (Secrets)
        env:
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          TS_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
        run: |
          FAIL=0
          [ -n "$SSH_KEY" ] || { echo "❌ Secret SSH_KEY fehlt"; FAIL=1; }
          [ -n "$VPS_USER" ] || { echo "❌ Secret VPS_USER fehlt"; FAIL=1; }
          [ -n "$TS_CLIENT_ID" ] || { echo "❌ Secret TAILSCALE_OAUTH_CLIENT_ID fehlt"; FAIL=1; }
          [ -n "$TS_CLIENT_SECRET" ] || { echo "❌ Secret TAILSCALE_OAUTH_CLIENT_SECRET fehlt"; FAIL=1; }
          [ -n "$TS_TAILNET" ] || { echo "❌ Secret TAILSCALE_TAILNET fehlt"; FAIL=1; }
          [ "$FAIL" -eq 0 ] || { echo "❌ Vorbedingungen nicht erfüllt – Abbruch"; exit 1; }
          echo "✅ Vorbedingungen ok (SSH_KEY, VPS_USER, OAuth, Tailnet)"

      - name: Connect Runner to Tailnet (MagicDNS)
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci,tag:ia4

      - name: Netmap-Sync abwarten
        run: sleep 15

      - name: VPS Tailscale-IP ermitteln (Tailscale-API; Fallback MagicDNS)
        env:
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          TS_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
        run: |
          set -uo pipefail
          NODE="vps-${{ env.TARGET }}"
          FQDN="${NODE}.${TS_TAILNET}"
          TS_TOKEN=""
          TS_IP=""

          # OAuth-Token holen (bis zu 3 Versuche; nur HTTP-Code sichtbar, Token maskiert)
          for try in 1 2 3; do
            RESP=$(curl -sS --max-time 30 -w '\n%{http_code}' \
              --data-urlencode "client_id=$TS_CLIENT_ID" \
              --data-urlencode "client_secret=$TS_CLIENT_SECRET" \
              "https://api.tailscale.com/api/v2/oauth/token")
            CODE=$(printf '%s' "$RESP" | tail -1)
            BODY=$(printf '%s' "$RESP" | sed '$d')
            TS_TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token // empty' 2>/dev/null || true)
            if [ -n "$TS_TOKEN" ]; then
              echo "::add-mask::$TS_TOKEN"
              echo "✅ OAuth-Token erhalten (HTTP ${CODE}, Versuch ${try})"
              break
            fi
            echo "⚠️ OAuth-Token fehlgeschlagen (HTTP ${CODE}, Versuch ${try})"
            sleep 5
          done

          # Geräteliste abfragen (nur wenn Token vorhanden)
          if [ -n "$TS_TOKEN" ]; then
            RESP=$(curl -sS --max-time 30 -w '\n%{http_code}' \
              "https://api.tailscale.com/api/v2/tailnet/${TS_TAILNET}/devices?fields=hostname,addresses" \
              -H "Authorization: Bearer ${TS_TOKEN}")
            CODE=$(printf '%s' "$RESP" | tail -1)
            BODY=$(printf '%s' "$RESP" | sed '$d')
            if [ "$CODE" = "200" ]; then
              TS_IP=$(printf '%s' "$BODY" | jq -r --arg n "$NODE" '[.devices[] | select(.hostname == $n or .hostname == ($n + "-1"))] | sort_by(.lastSeen // "") | reverse | .[0].addresses[0] // empty' 2>/dev/null | head -1 || true)
              [ "$TS_IP" = "null" ] && TS_IP=""
            else
              echo "⚠️ Devices-API Fehler (HTTP ${CODE}): $(printf '%s' "$BODY" | head -c 300)"
            fi
          fi

          # Fallback: MagicDNS-FQDN aus dem Inventar (Runner ist im Tailnet)
          if [ -z "$TS_IP" ]; then
            echo "⚠️ Keine Tailscale-IP via API – Fallback auf MagicDNS-FQDN ${FQDN}"
            VPS_TS_IP="$FQDN"
          else
            echo "✅ Node ${NODE} → ${TS_IP}"
            VPS_TS_IP="$TS_IP"
          fi
          echo "VPS_TS_IP=${VPS_TS_IP}" >> "$GITHUB_ENV"
          echo "✅ SSH-Ziel: ${VPS_TS_IP}"

      - name: SSH-Key vorbereiten
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_TS_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ansible installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ansible

      - name: "Diagnose ausführen (read-only, Inventar: inventories/${{ env.TARGET }}/hosts.yml)"
        working-directory: ansible
        run: |
          set -euo pipefail
          export SSH_KEY_PATH="$HOME/.ssh/id_ed25519"
          echo "▶️  tailscale serve status (read-only) auf vps-${TARGET} – keine Mutation"
          ansible-playbook playbooks/diagnose-tailscale-serve.yml \
            -i "inventories/${TARGET}/hosts.yml" \
            -e "ansible_host=$VPS_TS_IP"

      # =====================================================================
      # MCP-Diagnose (Issue #171) – STRENG READ-ONLY
      #   Pro OpenClaw-Instanz (oc1/oc2/oc3): `openclaw mcp list` + gdrive-Probe.
      #   Nur lesende Inspektion im Container; KEIN Deploy, KEIN `mcp add/remove`,
      #   keine Host-/Config-Änderung. stdout wird geloggt (keine Secret-Werte).
      # =====================================================================
      - name: "MCP-Diagnose (read-only): openclaw mcp list + doctor gdrive --probe"
        run: |
          set -uo pipefail
          SSH="ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i $HOME/.ssh/id_ed25519 $VPS_USER@$VPS_TS_IP"
          for i in oc1 oc2 oc3; do
            echo "===== INSTANCE openclaw-$i ====="
            echo "--- openclaw mcp list ---"
            $SSH "sudo docker exec openclaw-$i openclaw mcp list" 2>&1 || echo "(mcp list rc=$?)"
            echo "--- openclaw mcp doctor gdrive --probe ---"
            $SSH "sudo docker exec openclaw-$i openclaw mcp doctor gdrive --probe" 2>&1 || echo "(mcp doctor rc=$?)"
          done
