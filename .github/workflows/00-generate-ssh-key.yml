---
name: "00 – SSH-Key-Paar generieren"

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Vorhandenen Key überschreiben? (default: false)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  generate:
    name: "SSH-Key generieren + Secrets + cloud-config"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KEY_COMMENT: "iac4-deploy-key-$(date +%Y%m%d)"

    steps:
      - uses: actions/checkout@v4

      - name: Prüfen ob SSH_KEY bereits existiert
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if gh secret list --repo ${{ github.repository }} | grep -q "^SSH_KEY"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Sicherheitsstopp (force=false + Key existiert)
        if: steps.check.outputs.exists == 'true' && github.event.inputs.force != 'true'
        run: |
          echo "❌ SSH_KEY existiert bereits."
          echo "Setze force=true zum Überschreiben!"
          echo "⚠️  Das ändert auch den Public-Key in cloud-config.yaml!"
          exit 1

      - name: SSH-Key-Paar generieren
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force == 'true'
        run: |
          ssh-keygen -t ed25519 -f /tmp/iac4-key -N "" -C "$KEY_COMMENT"
          echo "PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/iac4-key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "PUBLIC_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/iac4-key.pub >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Private Key in GH Secrets speichern
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "$PRIVATE_KEY" | gh secret set SSH_KEY --repo ${{ github.repository }}
          echo "$PUBLIC_KEY" | gh secret set SSH_KEY_PUB --repo ${{ github.repository }}
          echo "✅ SSH_KEY und SSH_KEY_PUB in GH Secrets gespeichert"

      - name: cloud-config.yaml mit neuem Public-Key aktualisieren
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force == 'true'
        run: |
          # Public-Key aus env in cloud-config.yaml eintragen
          ESCAPED_KEY=$(echo "$PUBLIC_KEY" | sed 's|/|\\/|g')
          sed -i "s|ssh-ed25519 AAAA.*iac4-deploy-key|${ESCAPED_KEY}|" cloud-config.yaml
          echo "✅ cloud-config.yaml aktualisiert"

      - name: Änderungen committen
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force == 'true'
        env:
          GIT_BOT_EMAIL: ${{ secrets.GIT_BOT_EMAIL }}
        run: |
          git config user.email "${GIT_BOT_EMAIL}"
          git config user.name "IaC4 SSH-Key Bot"
          git add cloud-config.yaml
          git commit -m "chore(ssh): rotate SSH key - $KEY_COMMENT"
          git push
          echo "✅ cloud-config.yaml committed"

      - name: Public Key anzeigen
        if: always()
        run: |
          if [ -n "$PUBLIC_KEY" ]; then
            echo "=== Neuer Public-Key ==="
            echo "$PUBLIC_KEY"
          fi
