name: "01 – Tailscale Terraform (OAuth + ACLs)"

on:
  pull_request:
    paths:
      - 'terraform/**'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply ausführen?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force:
        description: 'Neuen Client erzwingen (alte manuell in TS-UI revoken)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  TF_VERSION: "1.11.0"
  TF_STATE_CACHE_KEY: "terraform-state-${{ github.ref_name }}"

jobs:
  terraform:
    name: "Terraform Plan/Apply"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/
    env:
      TF_IN_AUTOMATION: true
      TF_VAR_tailscale_api_key: ${{ secrets.TAILSCALE_API_KEY }}
      TF_VAR_tailscale_tailnet: ${{ secrets.TAILSCALE_TAILNET }}

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform State aus Cache holen
        id: cache
        uses: actions/cache@v4
        with:
          path: terraform/terraform.tfstate*
          key: ${{ env.TF_STATE_CACHE_KEY }}
          restore-keys: |
            terraform-state-${{ github.ref_name }}-

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Auf OAuth-Force-Prüfung
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "⚠️  force=true – Neuer OAuth-Client wird erstellt"
            echo "🔴 Hinweis: Alter Client muss in Tailscale-UI (Trust credentials) manuell revokt werden!"
            echo "force_create=true" >> $GITHUB_OUTPUT
          else
            echo "force_create=false" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Plan
        id: plan
        run: |
          if [ "${{ steps.check.outputs.force_create }}" = "true" ]; then
            # State löschen, damit Terraform einen neuen Client erstellt
            rm -f terraform.tfstate terraform.tfstate.backup
          fi
          terraform plan -no-color -input=false -out=plan_output 2>&1 | tee plan_stdout.txt
          echo "exitcode=$?" >> $GITHUB_OUTPUT

      - name: PR Kommentar (Plan)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan_stdout.txt', 'utf8');
            const output = `## IaC4 Terraform Plan (Tailscale)\n\`\`\`\n${plan.slice(0, 65000)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Apply
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true')
        run: terraform apply -auto-approve plan_output

      - name: OAuth-Secrets in GH speichern
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true')
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          CLIENT_ID=$(terraform output -raw new_oauth_client_id 2>/dev/null)
          CLIENT_SECRET=$(terraform output -raw new_oauth_client_secret 2>/dev/null)

          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "❌ Konnte OAuth-Credentials nicht aus Terraform-Output lesen"
            exit 1
          fi

          gh secret set TAILSCALE_OAUTH_CLIENT_ID \
            --body "$CLIENT_ID" \
            --repo ${{ github.repository }}

          gh secret set TAILSCALE_OAUTH_CLIENT_SECRET \
            --body "$CLIENT_SECRET" \
            --repo ${{ github.repository }}

          echo "✅ IaC4 OAuth-Secrets gespeichert"

      - name: Terraform State in Cache speichern
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true')
        uses: actions/cache/save@v4
        with:
          path: terraform/terraform.tfstate*
          key: ${{ env.TF_STATE_CACHE_KEY }}
