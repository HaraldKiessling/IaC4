---
# =============================================================================
# 01 – Tailscale Terraform (OAuth)
#
#   Verwaltet NUR den Tailscale-OAuth-Client (terraform/oauth-client.tf) und die
#   zugehoerigen GH-Secrets. Es gibt in IaC4 KEINE Terraform-ACL-Resource
#   (ADR-010).
#
#   GOVERNANCE (Owner-Entscheid 2026-09-11, Entscheid 1):
#     Dieser Workflow loest KEINEN ACL-Apply mehr aus. Der frueher hier
#     eingebaute Pfad `scripts/ensure-acl-ia4.py` (tag:ia4) ist ENTFERNT – ein
#     ACL-Apply darf NIEMALS automatisch aus dem push-/`terraform/**`-Trigger
#     (oder aus einem workflow_dispatch dieses Workflows) heraus laufen.
#     Der einzige ACL-Apply-Weg ist `.github/workflows/00-acl-apply.yml`:
#     ausschliesslich manuell (workflow_dispatch) mit expliziter
#     Governance-Bestaetigung (`confirm=APPLY-ACL`, `dry_run=false`).
#     `scripts/ensure-acl-ia4.py` bleibt lediglich als Kompatibilitaets-Shim
#     (→ `ensure-acl.py --rule iac4`) bestehen; es wird hier NICHT mehr aufgerufen.
#     Siehe docs/workflows/acl-migration-runbook.md (Migrations-Log) + ADR-026.
# =============================================================================
name: "01 – Tailscale Terraform (OAuth)"

on:
  pull_request:
    paths:
      - 'terraform/**'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply ausführen?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force:
        description: 'Neuen Client erzwingen (alte manuell in TS-UI revoken)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  pull-requests: write

env:
  TF_VERSION: "1.11.0"
  TF_STATE_CACHE_KEY: "terraform-state-${{ github.ref_name }}"

jobs:
  terraform:
    name: "Terraform Plan/Apply"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/
    env:
      TF_IN_AUTOMATION: true
      TF_VAR_tailscale_api_key: ${{ secrets.TAILSCALE_API_KEY }}
      TF_VAR_tailscale_tailnet: ${{ secrets.TAILSCALE_TAILNET }}

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform State aus Cache holen
        id: cache
        uses: actions/cache@v4
        with:
          path: terraform/terraform.tfstate*
          key: ${{ env.TF_STATE_CACHE_KEY }}
          restore-keys: |
            terraform-state-${{ github.ref_name }}-

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Auf OAuth-Force-Prüfung
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "⚠️  force=true – Neuer OAuth-Client wird erstellt"
            echo "🔴 Hinweis: Alter Client muss in Tailscale-UI (Trust credentials) manuell revokt werden!"
            echo "force_create=true" >> $GITHUB_OUTPUT
          else
            echo "force_create=false" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Plan
        id: plan
        run: |
          if [ "${{ steps.check.outputs.force_create }}" = "true" ]; then
            # State löschen, damit Terraform einen neuen Client erstellt
            rm -f terraform.tfstate terraform.tfstate.backup
          fi
          terraform plan -no-color -input=false -out=plan_output 2>&1 | tee plan_stdout.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: PR Kommentar (Plan)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan_stdout.txt', 'utf8');
            const output = `## IaC4 Terraform Plan (Tailscale)\n\`\`\`\n${plan.slice(0, 65000)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Apply
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true')
        run: terraform apply -auto-approve plan_output

      # HINWEIS (Owner-Entscheid 2026-09-11, Entscheid 1): Der frueher hier
      # stehende Schritt „ACL – IaC4-Regeln idempotent sicherstellen"
      # (Aufruf `scripts/ensure-acl-ia4.py`) ist ENTFERNT. Dieser Workflow darf
      # den tag:ia4-Apply NICHT mehr automatisch ausloesen. ACL-Aenderungen laufen
      # ausschliesslich manuell ueber `.github/workflows/00-acl-apply.yml`
      # (workflow_dispatch + `confirm=APPLY-ACL`). Absichtlich KEIN eingebautes
      # "Confirm" hier – der Terraform-Teil bleibt unveraendert. Siehe
      # docs/workflows/acl-migration-runbook.md und ADR-026.

      - name: OAuth-Secrets in GH speichern
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true')
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          CLIENT_ID=$(terraform output -raw new_oauth_client_id 2>/dev/null)
          CLIENT_SECRET=$(terraform output -raw new_oauth_client_secret 2>/dev/null)

          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "❌ Konnte OAuth-Credentials nicht aus Terraform-Output lesen"
            exit 1
          fi

          gh secret set TAILSCALE_OAUTH_CLIENT_ID \
            --body "$CLIENT_ID" \
            --repo ${{ github.repository }}

          gh secret set TAILSCALE_OAUTH_CLIENT_SECRET \
            --body "$CLIENT_SECRET" \
            --repo ${{ github.repository }}

          echo "✅ IaC4 OAuth-Secrets gespeichert"

      - name: Terraform State in Cache speichern
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true')
        uses: actions/cache/save@v4
        with:
          path: terraform/terraform.tfstate*
          key: ${{ env.TF_STATE_CACHE_KEY }}
