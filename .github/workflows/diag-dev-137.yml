# =============================================================================
# Diag – vps-dev Host-Zustand (read-only, NICHT fuer main gedacht)
#   Zweck: npm-Install-Tasks im Container sterben mit rc=137 (SIGKILL).
#   Klaert: Host-OOM? Disk voll? Docker-Reste? Container-Logs?
#   Keine Schreiboperation, kein Deploy.
# =============================================================================
name: "Diag – dev host 137 (read-only)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_USER: ${{ secrets.VPS_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Connect Runner to Tailnet (MagicDNS)
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci,tag:ia4

      - name: Netmap-Sync abwarten
        run: sleep 15

      - name: Tailscale OAuth-Token holen
        env:
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
        run: |
          TS_TOKEN=$(curl -s --max-time 30 --data-urlencode "client_id=$TS_CLIENT_ID" \
            --data-urlencode "client_secret=$TS_CLIENT_SECRET" \
            "https://api.tailscale.com/api/v2/oauth/token" | jq -r ".access_token")
          echo "TS_TOKEN=${TS_TOKEN}" >> $GITHUB_ENV

      - name: VPS Tailscale-IP ermitteln (vps-dev)
        env:
          TS_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
        run: |
          set -euo pipefail
          NODE="vps-dev"
          BODY=$(curl -sS "https://api.tailscale.com/api/v2/tailnet/${TS_TAILNET}/devices?fields=hostname,addresses" \
            -H "Authorization: Bearer ${TS_TOKEN}")
          TS_IP=$(printf "%s" "$BODY" | jq -r --arg n "$NODE" "[.devices[] | select(.hostname == $n or .hostname == ($n + \"-1\"))] | sort_by(.lastSeen // \"\") | reverse | .[0].addresses[0] // empty" | head -1)
          [ -n "$TS_IP" ] && [ "$TS_IP" != "null" ] || { echo "FEHLER: Keine Tailscale-IP fuer $NODE"; exit 1; }
          echo "VPS_TS_IP=$TS_IP" >> $GITHUB_ENV
          echo "Node $NODE -> $TS_IP"

      - name: SSH-Key vorbereiten
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_TS_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Host-Zustand (read-only)
        run: |
          set -uo pipefail
          SSH="ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o LogLevel=ERROR $VPS_USER@$VPS_TS_IP"
          echo "===== UPTIME/LOAD ====="
          $SSH "uptime; nproc; uname -r"
          echo "===== MEMORY ====="
          $SSH "free -m; echo; head -5 /proc/meminfo"
          echo "===== OOM-HISTORY ====="
          $SSH "sudo dmesg -T 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -20 || echo dmesg-leer"
          echo "===== DISK ====="
          $SSH "df -h / /var/lib/docker /srv 2>&1; echo; df -i / /srv 2>&1"
          echo "===== DOCKER SYSTEM DF ====="
          $SSH "docker system df 2>&1"
          echo "===== CONTAINERS ====="
          $SSH "docker ps -a --format '{{.Names}} {{.Image}} {{.Status}}' 2>&1"
          echo "===== IMAGES (top 15) ====="
          $SSH "docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | head -15"
          echo "===== LOGS oc1 (tail 40) ====="
          $SSH "docker logs --tail 40 openclaw-oc1 2>&1 | tail -40"
          echo "===== NPM/BINARIES IN CONTAINERN ====="
          $SSH "for c in oc1 oc2 oc3; do echo --- $c; docker exec openclaw-$c sh -lc 'node -v; npm -v; command -v qmd || echo qmd-missing' 2>&1; done"
