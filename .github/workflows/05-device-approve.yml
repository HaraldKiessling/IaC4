---
# 05 – OpenClaw Device-Pairing (Control-UI-Freigabe)
#   Workflow-basierte Gerätekopplung (IaC4-Zugriffs-Design: kein direkter VPS-Zugriff).
#   Flow: Control-UI zeigt "pairing required" + requestId -> diesen Workflow starten
#   (request_id aus der UI), Workflow listet pending Devices und approved die Request-ID.
#
#   M1a (Design 05 / reviewed Konzept §2.2):
#   - SSoT-Validierung der Instanz gegen ansible/group_vars/vps-<target>.yml (C1)
#   - Request-ID-Regex ^[a-zA-Z0-9_-]{8,64}$ (blockiert Injection-Versuche)
#   - Environment-Gate job-level: prod -> 'prod-approve' (Required Reviewer),
#     dev -> 'dev-approve' (OHNE Protection). Beide Environments anlegen (M2):
#     Settings -> Environments. Fehlt dev-approve, schlagen alle dev-Runs fehl (MAJOR #8).
#   - instance bleibt type: choice (MAJOR #9: M1a/M1b-Split, Umstellung auf
#     type: string erst M1b nach M3-Stabilisierung)
#   - Fehler-Handling "devices list": stiller Fehler (|| echo) behoben, Container-
#     Existenz-Pre-Check via docker inspect (Analyse-Befund #3)
name: "05 – OpenClaw Device-Pairing"

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Ziel-VPS'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]
      instance:
        description: 'OpenClaw-Instanz'
        required: true
        default: 'oc1'
        type: choice
        options: [oc1, oc2, oc3]
      request_id:
        description: 'Request-ID aus der Control-UI (leer = nur Liste anzeigen)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  pairing:
    name: "Device-Pairing (target: ${{ inputs.target }}, ${{ inputs.instance }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # M1a (MAJOR #8): echtes Environment-Gate statt Platzhalter. prod-approve mit
    # Required Reviewer (Harald bestätigt in GH-UI), dev-approve ohne Protection.
    environment: ${{ inputs.target == 'prod' && 'prod-approve' || 'dev-approve' }}
    env:
      VPS_USER: ${{ secrets.VPS_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      TS_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
      TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      # M1a (Konzept §2.2): Fail-Fast VOR Tailscale-Connect – kein unnötiger
      # Tailscale-Aufbau bei Tippfehlern; klare Fehlermeldung mit verfügbaren Instanzen.
      - name: Instanz gegen SSoT validieren
        run: |
          set -euo pipefail
          INST="${{ inputs.instance }}"
          TARGET="${{ inputs.target }}"
          SSOT_FILE="ansible/group_vars/vps-${TARGET}.yml"
          python3 -m pip install --quiet pyyaml
          python3 -c "
          import sys, yaml
          with open('${SSOT_FILE}', encoding='utf-8') as f:
              data = yaml.safe_load(f) or {}
          instances = [i['name'] for i in data.get('openclaw_instances', []) if i.get('enabled', False)]
          if '${INST}' not in instances:
              print(f'❌ Instanz \"${INST}\" in ${TARGET} nicht gefunden oder disabled.')
              print(f'   Verfügbare enabled Instanzen (${SSOT_FILE}): {instances}')
              sys.exit(1)
          print(f'✅ Instanz \"${INST}\" ist in ${TARGET} enabled (SSoT)')
          "

      # M1a (Konzept §2.2): Request-ID-Format – Regex blockiert Shell-Injection
      # (keine Metazeichen, 8-64 Zeichen, alphanumerisch + '_' + '-').
      - name: Request-ID-Format validieren
        if: inputs.request_id != ''
        run: |
          set -euo pipefail
          if ! echo "${{ inputs.request_id }}" | grep -qE '^[a-zA-Z0-9_-]{8,64}$'; then
            echo "❌ Ungültiges Request-ID-Format: '${{ inputs.request_id }}'"
            echo "   Erlaubt: alphanumerisch, '-' und '_', 8-64 Zeichen"
            exit 1
          fi
          echo "✅ Request-ID-Format ok"

      - name: Connect Runner to Tailnet
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci,tag:ia4

      - name: Tailscale-OAuth-Token + VPS-IP ermitteln
        run: |
          set -euo pipefail
          TS_TOKEN=$(curl -s --max-time 30 --data-urlencode "client_id=$TS_CLIENT_ID" \
            --data-urlencode "client_secret=$TS_CLIENT_SECRET" \
            "https://api.tailscale.com/api/v2/oauth/token" | jq -r '.access_token')
          NODE="vps-${{ inputs.target }}"
          TS_IP=$(curl -sS --max-time 30 "https://api.tailscale.com/api/v2/tailnet/${TS_TAILNET}/devices?fields=hostname,addresses,lastSeen" \
            -H "Authorization: Bearer $TS_TOKEN" | jq -r --arg n "$NODE" '[.devices[] | select(.hostname == $n)] | .[0].addresses[0]')
          [ -n "$TS_IP" ] || { echo "❌ Keine Tailscale-IP für $NODE"; exit 1; }
          echo "VPS_TS_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: SSH-Key vorbereiten
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # M1a (Analyse-Befund #3): Pre-Check Container-Existenz via docker inspect,
      # Exit 1 mit klarer Meldung statt stiller Fehler-Schluckung (|| echo).
      - name: Pending Devices auflisten
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o LogLevel=ERROR \
            "$VPS_USER@$VPS_TS_IP" \
            "sudo docker inspect openclaw-${{ inputs.instance }} >/dev/null 2>&1 || { echo \"❌ Container openclaw-${{ inputs.instance }} existiert nicht auf vps-${{ inputs.target }}\" >&2; exit 1; }; sudo docker exec openclaw-${{ inputs.instance }} openclaw devices list"

      - name: Request-ID approved (falls angegeben)
        if: inputs.request_id != ''
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o LogLevel=ERROR \
            "$VPS_USER@$VPS_TS_IP" "sudo docker exec openclaw-${{ inputs.instance }} openclaw devices approve ${{ inputs.request_id }}"
