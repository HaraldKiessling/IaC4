---
# 05 – Unified Freigabe: Telegram-Pairing + Device-Approve (ID-basiert)
#   v3.0 (Ein-Job-Design, 2026-08-06 – Workflow-05-Performance-Optimierung,
#   Review-Befunde R01-R08 aufgelöst):
#   - EIN Job: Discovery + Approve in DERSELBEN SSH-Session (APPROVE-BEGIN/END-
#     Marker, discovery.py v3.0). KEIN environment:-Gate, KEIN Required Reviewer
#     (Owner-Entscheidung 2026-08-06 14:48: „Nein, kein Klick notwendig …“).
#   - 1 SSH pro VPS statt pro Instanz: VPS-Gruppierung (group_by_vps) + Remote-
#     Schleife über alle Instanzen (build_ein_job_remote_cmd); type=both fragt
#     pairing + devices in DERSELBEN Session ab (R02).
#   - Concurrency-Group `device-approve` (cancel-in-progress: false) verhindert
#     parallele Approve-Runs (Doppel-Approve).
#   - Inputs UNVERÄNDERT (R01/R04): `id` (Telegram-Bot-Payload
#     client_payload.id!), `type`, `target`, `instance` (all|oc1…ocN).
#   - Tailscale-Action v4.1.3 (R05); Auth via tools/telegram-approve-bot/
#     auth_check.sh + discovery.py --validate-id (R07); kein jq auf den VPS
#     (R08 – Remote-Match per grep, Verifikation in Python).
#   - Ersetzt: v2.2 (Zwei-Job) – approve_step.py bleibt als Library erhalten
#     (DEPRECATED für Workflow-Aufrufe, M3), wird aber nicht mehr vom Workflow
#     aufgerufen (R03-E12).
#
#   Secrets (Ist-Zustand, M2): TAILSCALE_OAUTH_CLIENT_ID /
#   TAILSCALE_OAUTH_CLIENT_SECRET (Tailscale-Action v4.1.3, NICHT TS_OAUTH_*),
#   VPS_USER, SSH_KEY, TELEGRAM_APPROVE_USERS (Whitelist für den Telegram-Pfad,
#   M1: wird im Validate-Step als AUTHORIZED_USERS an auth_check.sh gereicht).
#
#   Sicherheits-Gates: Whitelist (repository_dispatch, auth_check.sh),
#   Regex-Sperre je Typ (discovery.py --validate-id), Tailscale-only SSH,
#   keine Secrets in Logs, Audit = GH Actions Run.
#   Job-Outputs (m3): entfallen mit dem zweiten Job – kein externer Consumer
#   (kein needs.discover); approve.py schreibt GITHUB_OUTPUT nur noch für
#   Debug/Audit im Run-Log.
name: "05 – Freigabe (Telegram-Pairing + Device-Approve, Ein-Job)"

run-name: "approve ${{ inputs.id || github.event.client_payload.id }}"

on:
  workflow_dispatch:
    inputs:
      id:
        description: 'Request-ID (Pairing-Code QVDCXJEM ODER Device-ID 9df47d69…)'
        required: true
        type: string
      type:
        description: 'Typ (auto = aus ID-Format ableiten)'
        required: false
        default: 'auto'
        type: choice
        options: [auto, telegram, device, both]
      target:
        description: 'Ziel-VPS (dev | prod | both)'
        required: false
        default: 'both'
        type: choice
        options: [both, dev, prod]
      instance:
        description: 'OC-Instanz (all = alle, oder oc1…ocN)'
        required: false
        default: 'all'
        type: string
  repository_dispatch:
    types: [device-approve]

permissions:
  contents: read

# ★ Concurrency-Group: verhindert parallele Approve-Runs (Design §5).
#   cancel-in-progress: false → neue Runs warten in der Queue, statt einen
#   laufenden Approve abzubrechen (konservativ, kein Doppel-Approve).
concurrency:
  group: device-approve
  cancel-in-progress: false

jobs:
  discover-and-approve:
    name: "Discovery + Approve (${{ inputs.target || 'both' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ★ KEIN environment:-Attribut – Owner-Entscheidung: kein Gate nötig.
    env:
      VPS_USER: ${{ secrets.VPS_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      TS_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
      TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      # Eingaben validieren + normalisieren + Typ ableiten (R01: Input-Name
      # bleibt `id` – client_payload.id; R07: Auth-Check via auth_check.sh,
      # ID-Validierung + Typ-Ableitung via discovery.py --validate-id).
      - name: Eingaben validieren + normalisieren + Typ ableiten
        id: inputs
        env:
          INPUT_ID: ${{ github.event.inputs.id || github.event.client_payload.id }}
          INPUT_TYPE: ${{ github.event.inputs.type || github.event.client_payload.type || 'auto' }}
          INPUT_TARGET: ${{ github.event.inputs.target || github.event.client_payload.target || 'both' }}
          INPUT_INSTANCE: ${{ github.event.inputs.instance || github.event.client_payload.instance || 'all' }}
          TG_USER_ID: ${{ github.event.client_payload.telegram_user_id || '' }}
          AUTHORIZED_USERS: ${{ secrets.TELEGRAM_APPROVE_USERS }}
        run: |
          set -euo pipefail

          # Auth nur für repository_dispatch (Telegram-Pfad): auth_check.sh prüft
          # NUR die User-ID (Nicht-Leer + numerisch VOR Whitelist-Grep). M1: der
          # Whitelist-Check bleibt in auth_check.sh (R07-bevorzugt statt
          # Python-Migration) – TELEGRAM_APPROVE_USERS-Secret wird oben als
          # AUTHORIZED_USERS referenziert. Die Request-ID-Validierung ist an
          # discovery.py --validate-id delegiert (Single Source of Truth – auch
          # 6-7-stellige Pairing-Kurzcodes).
          if [ -n "$TG_USER_ID" ]; then
            export TG_USER_ID AUTHORIZED_USERS
            bash tools/telegram-approve-bot/auth_check.sh
          fi

          # ID-Validierung + Typ-Ableitung (Zwei-Format-Regex, keine Shell)
          DERIVED_TYPE=$(python3 tools/device-approve/discovery.py \
            --validate-id "$INPUT_ID" --type "$INPUT_TYPE")

          # Instanz-Validierung: 'all' oder oc[1-9][0-9]* (kein oc0)
          if [ "$INPUT_INSTANCE" != "all" ]; then
            if ! printf '%s' "$INPUT_INSTANCE" | grep -qE '^oc[1-9][0-9]*$'; then
              echo "❌ Ungültige Instanz: '$INPUT_INSTANCE'" >&2
              echo "   Erlaubt: 'all' oder 'oc1', 'oc2', … (kein 'oc0')" >&2
              exit 1
            fi
          fi

          {
            echo "APPROVE_ID=$INPUT_ID"
            echo "DERIVED_TYPE=$DERIVED_TYPE"
            echo "APPROVE_TARGET=$INPUT_TARGET"
            echo "APPROVE_INSTANCE=$INPUT_INSTANCE"
          } >> "$GITHUB_ENV"
          echo "✅ Eingaben validiert (id=$INPUT_ID, derived_type=$DERIVED_TYPE, target=$INPUT_TARGET, instance=$INPUT_INSTANCE)"

      # SSoT-Mapping (dynamisches Globbing vps-*.yml) + Filter target/instance
      - name: Instanz-Mapping laden (SSoT) + filtern
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 tools/telegram-approve-bot/sot_parser.py . > /tmp/instance-map-full.txt

          python3 -c "
          target_filter = '$APPROVE_TARGET'
          inst_filter = '$APPROVE_INSTANCE'
          with open('/tmp/instance-map-full.txt') as f:
              for line in f:
                  name, _, target = line.strip().partition('|')
                  if not name:
                      continue
                  if target_filter not in ('both', target):
                      continue
                  if inst_filter not in ('all', name):
                      continue
                  print(f'{name}|{target}')
          " > /tmp/instance-map.txt

          cat /tmp/instance-map.txt

      - name: Connect Runner to Tailnet
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci,tag:ia4

      - name: SSH-Key vorbereiten
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # ★ EINZIGER Discovery+Approve-Schritt (Ein-Job, v3.0): --full-run ruft
      # discovery.py-run_discovery mit VPS-Gruppierung auf (1 SSH pro VPS);
      # der Approve läuft direkt in der SSH-Session beim Fund – auch bei prod
      # (kein Gate). Exit-Code: 0 = approved, 1 = nicht gefunden/Fehler.
      - name: Discovery + Approve (Ein-Job)
        id: full_run
        run: |
          set -euo pipefail
          {
            echo "## 🚀 Discovery + Approve (Ein-Job, v3.0)"
            echo ""
            echo "| Feld | Wert |"
            echo "|------|------|"
            echo "| **ID** | \`$APPROVE_ID\` |"
            echo "| **Target** | $APPROVE_TARGET |"
            echo "| **Typ** | $DERIVED_TYPE |"
            echo "| **Instanz** | $APPROVE_INSTANCE |"
            echo "| **Trigger** | ${{ github.event_name }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          python3 tools/device-approve/approve.py \
            --full-run \
            --instance-map /tmp/instance-map.txt \
            --request-id "$APPROVE_ID" \
            --type-filter "$DERIVED_TYPE" \
            --target-filter "$APPROVE_TARGET" \
            --instance-filter "$APPROVE_INSTANCE" \
            --vps-user "$VPS_USER" \
            --ssh-key ~/.ssh/id_ed25519 \
            --ts-tailnet "$TS_TAILNET" \
            --ts-client-id "$TS_CLIENT_ID" \
            --ts-client-secret "$TS_CLIENT_SECRET" \
            --summary

          {
            echo ""
            echo "✅ **Ein-Job-Design: Direktfreigabe in der SSH-Session – kein separater Approve-Job, kein Environment-Gate.**"
          } >> "$GITHUB_STEP_SUMMARY"
