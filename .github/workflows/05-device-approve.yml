---
# 05 – Unified Freigabe: Telegram-Pairing + Device-Approve (ID-basiert)
#   v3.0 (Ein-Job-Design, 2026-08-06 – Workflow-05-Performance-Optimierung,
#   Review-Befunde R01-R08 aufgelöst):
#   - EIN Job: Discovery + Approve in DERSELBEN SSH-Session (APPROVE-BEGIN/END-
#     Marker, discovery.py v3.0). KEIN environment:-Gate, KEIN Required Reviewer
#     (Owner-Entscheidung 2026-08-06 14:48: „Nein, kein Klick notwendig …“).
#   - 1 SSH pro VPS statt pro Instanz: VPS-Gruppierung (group_by_vps) + Remote-
#     Schleife über alle Instanzen (build_ein_job_remote_cmd); type=both fragt
#     pairing + devices in DERSELBEN Session ab (R02).
#   - Concurrency-Group `device-approve` (cancel-in-progress: false) verhindert
#     parallele Approve-Runs (Doppel-Approve).
#   - Inputs UNVERÄNDERT (R01/R04): `id` (Telegram-Bot-Payload
#     client_payload.id!), `type`, `target`, `instance` (all|oc1…ocN).
#   - Tailscale-Action v4.1.3 (R05); Auth via tools/telegram-approve-bot/
#     auth_check.sh + discovery.py --validate-id (R07); kein jq auf den VPS
#     (R08 – Remote-Match per grep, Verifikation in Python).
#   - Ersetzt: v2.2 (Zwei-Job) – approve_step.py bleibt als Library erhalten
#     (DEPRECATED für Workflow-Aufrufe, M3), wird aber nicht mehr vom Workflow
#     aufgerufen (R03-E12).
#
#   v3.1 (Listen-Modus, 2026-08-06 – Design 05-workflow-listen-modus.md,
#   Review-Befunde R01-R09 aufgelöst):
#   - NEUER Input `mode` (approve|list, default approve). Bei mode=list wird
#     KEINE Request-ID benötigt (`id` required: false): aggregiert über alle
#     (gefilterten) Instanzen je VPS-SSH alle pending Requests
#     (pairing requests[] + devices pending[]) → Job-Summary-Tabelle + JSON.
#     KEIN Approve; Exit 0 auch bei leerer Liste (grün).
#   - R01: JSON-Block-Generierung geteilt (discovery.py
#     _build_json_collection_block) – build_ein_job_remote_cmd (Approve) und
#     build_list_remote_cmd (List) nutzen dieselbe Quelle.
#   - R02 Mapping mode→CLI: approve → --full-run --request-id $APPROVE_ID
#     (--validate-id im Validate-Step); list → --list-only (OHNE --request-id;
#     gefüllte `id` wird im Validate-Step NICHT validiert und NICHT in
#     GITHUB_ENV geschrieben). type=auto wird im Listen-Modus zu 'both' (O3:
#     keine ID zum Ableiten).
#   - R06 Concurrency: Der Listen-Modus teilt die Concurrency-Group
#     `device-approve` (cancel-in-progress: false) → serielle Ausführung. Ein
#     List-Run wird hinter einem laufenden Approve-Run in die Queue gestellt –
#     konservativ-korrekt (kein stale read), kann aber zu Wartezeiten führen.
#   - R09 Timeout: identisch zum Approve-Modus – timeout-minutes: 15
#     (Workflow), SSH_TIMEOUT=60s (Python). Worst-Case bei 5 unerreichbaren
#     VPS: ~5×60s ≈ 5 Min. (List-Mode hat keinen Approve-Schritt → kürzer
#     als Approve-Mode).
#   - Auth-Gates UNVERÄNDERT: Whitelist (repository_dispatch, auth_check.sh),
#     Tailscale-only SSH; --validate-id NUR im Approve-Modus.
#
#   v3.2 (Reject-Modus, 2026-08-07 – Diagnose-Folgeauftrag):
#   - Input `mode` erweitert um 'reject' (options: approve|list|reject).
#     mode=reject analog zum approve-Pfad: ID wird validiert (--validate-id,
#     Zwei-Format-Regex) und per Ein-Job-Remote-Schleife in der SSH-Session
#     `openclaw devices reject <ID>` ausgeführt (REJECT-Marker, B2-Semantik,
#     discovery.py action="reject"; approve.py --reject-only).
#   - NUR device-Requests: die openclaw CLI hat kein 'pairing reject'
#     (empirisch 2026-08-07) → reject mit abgeleitetem Typ != device bricht
#     im Validate-Step ab (exit 1) und in approve.py (exit 2, defense in
#     depth). ID-Formate unverändert (Pairing-Kurzcode 6-12 / Device 36-128
#     Hex-mit-Dash) – gleiche Regex wie approve.
#   - Exit-Code-Vertrag wie approve: 0 = rejected ODER not_found (grün),
#     1 = error, 2 = Config. Concurrency-Group/Timeouts unverändert.
#
#   Secrets (Ist-Zustand, M2): TAILSCALE_OAUTH_CLIENT_ID /
#   TAILSCALE_OAUTH_CLIENT_SECRET (Tailscale-Action v4.1.3, NICHT TS_OAUTH_*),
#   VPS_USER, SSH_KEY, TELEGRAM_APPROVE_USERS (Whitelist für den Telegram-Pfad,
#   M1: wird im Validate-Step als AUTHORIZED_USERS an auth_check.sh gereicht).
#
#   Sicherheits-Gates: Whitelist (repository_dispatch, auth_check.sh),
#   Regex-Sperre je Typ (discovery.py --validate-id), Tailscale-only SSH,
#   keine Secrets in Logs, Audit = GH Actions Run.
#   Job-Outputs (m3): entfallen mit dem zweiten Job – kein externer Consumer
#   (kein needs.discover); approve.py schreibt GITHUB_OUTPUT nur noch für
#   Debug/Audit im Run-Log.
name: "05 – Freigabe (Telegram-Pairing + Device-Approve, Ein-Job)"

run-name: "${{ inputs.mode || 'approve' }} ${{ inputs.id || github.event.client_payload.id || '' }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modus (approve = Freigabe einer ID, list = alle pending Requests anzeigen, reject = Request ablehnen – nur device)'
        required: false
        default: 'approve'
        type: choice
        options: [approve, list, reject]
      id:
        description: 'Request-ID (Pairing-Code QVDCXJEM ODER Device-ID 9df47d69…) – nur bei mode=approve|reject'
        required: false
        type: string
      type:
        description: 'Typ (auto = aus ID-Format ableiten; bei mode=list default both)'
        required: false
        default: 'auto'
        type: choice
        options: [auto, telegram, device, both]
      target:
        description: 'Ziel-VPS (dev | prod | both)'
        required: false
        default: 'both'
        type: choice
        options: [both, dev, prod]
      instance:
        description: 'OC-Instanz (all = alle, oder oc1…ocN)'
        required: false
        default: 'all'
        type: string
  repository_dispatch:
    types: [device-approve]

permissions:
  contents: read

# ★ Concurrency-Group: verhindert parallele Approve-Runs (Design §5).
#   R06: Auch der Listen-Modus teilt diese Gruppe (seriell, kein stale read) –
#   ein List-Run wartet hinter einem laufenden Approve-Run in der Queue.
#   cancel-in-progress: false → neue Runs warten, statt einen laufenden
#   Approve abzubrechen (konservativ, kein Doppel-Approve).
concurrency:
  group: device-approve
  cancel-in-progress: false

jobs:
  discover-and-approve:
    name: "${{ inputs.mode == 'list' && 'Pending-Requests listen' || 'Discovery + Approve/Reject' }} (${{ inputs.target || 'both' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15  # R09: identisch zum Approve-Modus (Worst-Case 5 unerreichbare VPS ≈ 5 Min.)
    # ★ KEIN environment:-Attribut – Owner-Entscheidung: kein Gate nötig.
    env:
      VPS_USER: ${{ secrets.VPS_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      TS_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
      TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      # Eingaben validieren + normalisieren + Typ ableiten (R01: Input-Name
      # bleibt `id` – client_payload.id; R07: Auth-Check via auth_check.sh,
      # ID-Validierung + Typ-Ableitung via discovery.py --validate-id).
      # v3.1 (R02): Mode-abhängig – bei mode=list wird eine gefüllte `id`
      # NICHT validiert und NICHT in GITHUB_ENV geschrieben (approve.py
      # erhält kein --request-id). --validate-id läuft NUR im Approve-/
      # Reject-Modus (v3.2; reject zusätzlich mit device-only-Hard-Gate).
      - name: Eingaben validieren + normalisieren + Typ ableiten
        id: inputs
        env:
          INPUT_ID: ${{ github.event.inputs.id || github.event.client_payload.id }}
          INPUT_TYPE: ${{ github.event.inputs.type || github.event.client_payload.type || 'auto' }}
          INPUT_TARGET: ${{ github.event.inputs.target || github.event.client_payload.target || 'both' }}
          INPUT_INSTANCE: ${{ github.event.inputs.instance || github.event.client_payload.instance || 'all' }}
          INPUT_MODE: ${{ inputs.mode || 'approve' }}
          TG_USER_ID: ${{ github.event.client_payload.telegram_user_id || '' }}
          AUTHORIZED_USERS: ${{ secrets.TELEGRAM_APPROVE_USERS }}
        run: |
          set -euo pipefail

          # Auth nur für repository_dispatch (Telegram-Pfad): auth_check.sh prüft
          # NUR die User-ID (Nicht-Leer + numerisch VOR Whitelist-Grep). M1: der
          # Whitelist-Check bleibt in auth_check.sh (R07-bevorzugt statt
          # Python-Migration) – TELEGRAM_APPROVE_USERS-Secret wird oben als
          # AUTHORIZED_USERS referenziert. Die Request-ID-Validierung ist an
          # discovery.py --validate-id delegiert (Single Source of Truth – auch
          # 6-7-stellige Pairing-Kurzcodes).
          if [ -n "$TG_USER_ID" ]; then
            export TG_USER_ID AUTHORIZED_USERS
            bash tools/telegram-approve-bot/auth_check.sh
          fi

          # Instanz-Validierung (BEIDE Modi): 'all' oder oc[1-9][0-9]* (kein oc0)
          if [ "$INPUT_INSTANCE" != "all" ]; then
            if ! printf '%s' "$INPUT_INSTANCE" | grep -qE '^oc[1-9][0-9]*$'; then
              echo "❌ Ungültige Instanz: '$INPUT_INSTANCE'" >&2
              echo "   Erlaubt: 'all' oder 'oc1', 'oc2', … (kein 'oc0')" >&2
              exit 1
            fi
          fi

          if [ "$INPUT_MODE" = "list" ]; then
            # ── Listen-Modus (v3.1, R02) ──
            # id wird ignoriert: NICHT validieren, NICHT in GITHUB_ENV schreiben,
            # NICHT an approve.py übergeben. type=auto → both (O3: keine ID zum
            # Ableiten – Diagnose will ALLES sehen).
            LIST_TYPE="$INPUT_TYPE"
            [ "$LIST_TYPE" = "auto" ] && LIST_TYPE="both"
            {
              echo "APPROVE_ID="
              echo "DERIVED_TYPE=$LIST_TYPE"
              echo "APPROVE_TARGET=$INPUT_TARGET"
              echo "APPROVE_INSTANCE=$INPUT_INSTANCE"
            } >> "$GITHUB_ENV"
            echo "📋 Listen-Modus: id='${INPUT_ID:-}' ignoriert (keine Validierung, R02), type=$LIST_TYPE"
          else
            # ── Approve-/Reject-Modus (v3.2) ──
            # ID-Validierung + Typ-Ableitung (Zwei-Format-Regex, keine Shell)
            DERIVED_TYPE=$(python3 tools/device-approve/discovery.py \
              --validate-id "$INPUT_ID" --type "$INPUT_TYPE")

            # v3.2 (Reject-Modus): NUR device-Requests – die openclaw CLI hat
            # kein 'pairing reject' (nur `openclaw devices reject <ID>`).
            if [ "$INPUT_MODE" = "reject" ] && [ "$DERIVED_TYPE" != "device" ]; then
              echo "❌ Reject-Modus: nur device-Requests unterstuetzt (kein 'pairing reject' in der openclaw CLI)." >&2
              exit 1
            fi

            {
              echo "APPROVE_ID=$INPUT_ID"
              echo "DERIVED_TYPE=$DERIVED_TYPE"
              echo "APPROVE_TARGET=$INPUT_TARGET"
              echo "APPROVE_INSTANCE=$INPUT_INSTANCE"
            } >> "$GITHUB_ENV"
            echo "✅ Eingaben validiert (mode=$INPUT_MODE, id=$INPUT_ID, derived_type=$DERIVED_TYPE, target=$INPUT_TARGET, instance=$INPUT_INSTANCE)"
          fi

      # SSoT-Mapping (dynamisches Globbing vps-*.yml) + Filter target/instance
      - name: Instanz-Mapping laden (SSoT) + filtern
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 tools/telegram-approve-bot/sot_parser.py . > /tmp/instance-map-full.txt

          python3 -c "
          target_filter = '$APPROVE_TARGET'
          inst_filter = '$APPROVE_INSTANCE'
          with open('/tmp/instance-map-full.txt') as f:
              for line in f:
                  name, _, target = line.strip().partition('|')
                  if not name:
                      continue
                  if target_filter not in ('both', target):
                      continue
                  if inst_filter not in ('all', name):
                      continue
                  print(f'{name}|{target}')
          " > /tmp/instance-map.txt

          cat /tmp/instance-map.txt

      - name: Connect Runner to Tailnet
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci,tag:ia4

      - name: SSH-Key vorbereiten
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # ★ EINZIGER Discovery+Aktions-Schritt (Ein-Job, v3.0; v3.2: auch Reject):
      # --full-run ruft discovery.py-run_discovery mit VPS-Gruppierung auf
      # (1 SSH pro VPS); die Aktion (Approve ODER Reject) läuft direkt in der
      # SSH-Session beim Fund – auch bei prod (kein Gate). mode=reject →
      # --reject-only (Ein-Job-Reject, REJECT-Marker). Exit-Code-Vertrag
      # (Owner-Vereinbarung 15:06):
      #   0 = approved/rejected ODER not_found (gruener Run – Status im JSON/stdout),
      #   1 = error (Infrastruktur/Auth/Aktions-Fehler – roter Run).
      # not_found wird NICHT separat behandelt und NICHT mit `|| true`
      # maskiert – approve.py liefert dafuer Exit-Code 0.
      # v3.1: läuft NUR im Approve-/Reject-Modus (mode=list überspringt diesen Step).
      - name: Discovery + Aktion (Approve/Reject, Ein-Job)
        id: full_run
        if: ${{ inputs.mode != 'list' }}
        env:
          INPUT_MODE: ${{ inputs.mode || 'approve' }}
        run: |
          set -euo pipefail
          {
            echo "## 🚀 Discovery + Aktion (Approve/Reject, Ein-Job, v3.0/v3.2)"
            echo ""
            echo "| Feld | Wert |"
            echo "|------|------|"
            echo "| **Modus** | $INPUT_MODE |"
            echo "| **ID** | \`$APPROVE_ID\` |"
            echo "| **Target** | $APPROVE_TARGET |"
            echo "| **Typ** | $DERIVED_TYPE |"
            echo "| **Instanz** | $APPROVE_INSTANCE |"
            echo "| **Trigger** | ${{ github.event_name }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # v3.2: mode=reject → --reject-only (Ein-Job-Reject)
          ARGS=(--full-run)
          if [ "$INPUT_MODE" = "reject" ]; then
            ARGS+=(--reject-only)
          fi

          python3 tools/device-approve/approve.py "${ARGS[@]}" \
            --instance-map /tmp/instance-map.txt \
            --request-id "$APPROVE_ID" \
            --type-filter "$DERIVED_TYPE" \
            --target-filter "$APPROVE_TARGET" \
            --instance-filter "$APPROVE_INSTANCE" \
            --vps-user "$VPS_USER" \
            --ssh-key ~/.ssh/id_ed25519 \
            --ts-tailnet "$TS_TAILNET" \
            --ts-client-id "$TS_CLIENT_ID" \
            --ts-client-secret "$TS_CLIENT_SECRET" \
            --summary

          {
            echo ""
            echo "✅ **Ein-Job-Design: Direktfreigabe/-ablehnung in der SSH-Session – kein separater Job, kein Environment-Gate.**"
          } >> "$GITHUB_STEP_SUMMARY"

      # ★ Listen-Modus (v3.1): --list-only aggregiert ALLE pending Requests
      # über alle (gefilterten) Instanzen (1 SSH pro VPS, build_list_remote_cmd
      # – KEIN Approve). JSON auf stdout (Run-Log), Markdown-Tabelle via
      # --summary in die Job-Summary. Exit-Code-Vertrag: 0 = Liste erstellt
      # (auch leer = grün), 1 = Infrastruktur/Auth, 2 = Config.
      - name: Pending-Requests listen (Listen-Modus)
        id: list_run
        if: ${{ inputs.mode == 'list' }}
        run: |
          set -euo pipefail

          python3 tools/device-approve/approve.py \
            --list-only \
            --instance-map /tmp/instance-map.txt \
            --type-filter "$DERIVED_TYPE" \
            --target-filter "$APPROVE_TARGET" \
            --instance-filter "$APPROVE_INSTANCE" \
            --vps-user "$VPS_USER" \
            --ssh-key ~/.ssh/id_ed25519 \
            --ts-tailnet "$TS_TAILNET" \
            --ts-client-id "$TS_CLIENT_ID" \
            --ts-client-secret "$TS_CLIENT_SECRET" \
            --summary
