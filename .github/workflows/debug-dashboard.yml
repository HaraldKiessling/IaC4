---
# DEBUG – Dashboard-Diagnose (temporär, 2026-08-01): HTTPS-Certs, Serve, Whitelist-IP
name: "DEBUG – Dashboard-Diagnose"

on:
  workflow_dispatch:

permissions: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_USER: ${{ secrets.VPS_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      TS_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
      TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Connect Runner to Tailnet
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci,tag:ia4
      - name: Tailscale-OAuth-Token
        run: |
          TOKEN=$(curl -s --max-time 30 --data-urlencode "client_id=$TS_CLIENT_ID" \
            --data-urlencode "client_secret=$TS_CLIENT_SECRET" \
            "https://api.tailscale.com/api/v2/oauth/token" | jq -r '.access_token')
          echo "::add-mask::$TOKEN"
          echo "TS_TOKEN=${TOKEN}" >> $GITHUB_ENV
      - name: "1) Tailnet-DNS-Config (httpsCertsEnabled?)"
        run: |
          echo "=== DNS-Config ==="
          curl -sS "https://api.tailscale.com/api/v2/tailnet/$TS_TAILNET/dns/config" \
            -H "Authorization: Bearer $TS_TOKEN" | jq -c '{magicDnsEnabled, httpsCertsEnabled}'
      - name: "2) Runner: MagicDNS + HTTPS-Test"
        run: |
          echo "=== getent hosts ==="
          getent hosts vps-dev.$TS_TAILNET.ts.net || echo "DNS-FEHLER"
          echo "=== curl -v https (kurz) ==="
          curl -sv --connect-timeout 8 -o /dev/null "https://vps-dev.$TS_TAILNET.ts.net/dashboard/" 2>&1 | grep -E "(Trying|Connected|SSL|HTTP|error|refused|timed out|Could not)" | head -12
      - name: "3) VPS: Serve-Status + Whitelist-Check"
        run: |
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          NODE="vps-dev"
          TS_IP=$(curl -sS "https://api.tailscale.com/api/v2/tailnet/$TS_TAILNET/devices?fields=hostname,addresses,lastSeen" \
            -H "Authorization: Bearer $TS_TOKEN" | jq -r --arg n "$NODE" '[.devices[] | select(.hostname == $n)] | .[0].addresses[0]')
          echo "VPS-IP: $TS_IP"
          echo "=== tailscale serve status ==="
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o LogLevel=ERROR "$VPS_USER@$TS_IP" "sudo tailscale serve status" || echo "serve-status FEHLER"
          echo "=== localhost:8080 Code ==="
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o LogLevel=ERROR "$VPS_USER@$TS_IP" "curl -s -o /dev/null -w 'code=%{http_code}\n' http://127.0.0.1:8080/dashboard/" || echo "curl FEHLER"
          echo "=== Traefik-Log (Fehler/Config) ==="
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o LogLevel=ERROR "$VPS_USER@$TS_IP" "sudo docker logs traefik --tail 30 2>&1 | grep -iE 'error|warn|middleware|router' | tail -8" || echo "keine Log-Zeilen"
          echo "=== Traefik-Config auf VPS (gerendert) ==="
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o LogLevel=ERROR "$VPS_USER@$TS_IP" "sudo cat /opt/traefik/config/config.yml" || echo "cat FEHLER"
