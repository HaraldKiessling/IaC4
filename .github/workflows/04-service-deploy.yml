# =============================================================================
# 04 – Service-Deploy (Phase 2c/2d/2e)
#   Ein Workflow mit Playbook-Selektion – deployt Services auf den Ziel-VPS.
#   Auswahl (playbook):
#     docker-traefik : Docker-Engine + Traefik (Reverse Proxy)
#     services       : Ollama, Qdrant, Code-Server
#     openclaw       : OpenClaw-Gateways (instance: all | oc1 | oc2 | oc3)
#   Reihenfolge (Operator-Verantwortung): 1. docker-traefik, 2. services, 3. openclaw
#   Vorbedingung: Workflow 03 (Baseline) gelaufen, VPS via Tailscale erreichbar.
#   Optionen: skip_bootstrap (Benchmark), clean (destruktiv – PROD nur mit confirm_clean_prod)
#   bitwarden_secret (ADR-027, Owner-only): write|delete der Tresor-Datei VOR dem Deploy, im
#     geschuetzten GH Environment oc-bitwarden-<target> (Required Reviewer Harald). Als Job in
#     diesem Workflow, weil der "Run workflow"-Knopf nur fuer Workflows auf main erscheint –
#     so laeuft der DEV-Test vom Branch vor dem Merge (Owner-Reihenfolge 2026-10-10).
# =============================================================================
name: "04 – Service-Deploy (docker-traefik | services | openclaw)"

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Ziel-VPS'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      playbook:
        description: 'Playbook (Reihenfolge: 1. docker-traefik, 2. services, 3. openclaw)'
        required: true
        type: choice
        options:
          - docker-traefik
          - services
          - openclaw
      instance:
        description: 'OpenClaw-Instanz (nur playbook=openclaw): all | oc1 | oc2 | oc3'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - oc1
          - oc2
          - oc3
      skip_bootstrap:
        description: 'skipBootstrap-Modus: verhindert BOOTSTRAP.md-Erzeugung + entfernt bestehende (generisch – wird u.a. vom OC-Benchmark verwendet)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      clean:
        description: 'CLEAN-Modus (Issue #78): Session-Store/QMD/Agent-Dirs + Workspace zurücksetzen – deterministische Benchmark-Startbedingung'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      confirm_clean_prod:
        description: 'HUMAN-APPROVAL: Clean auf PROD bestätigen (destruktiv – Freigabe Harald, Issue #78)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      bitwarden_secret:
        description: 'OWNER-ONLY (ADR-027): Tresor-Datei /etc/ia4/oc-bitwarden.env schreiben/loeschen – wartet auf Freigabe im GH Environment oc-bitwarden-<target>'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - write
          - delete
      verify_token:
        description: 'Gateway-Token-Verifikation nach Deploy (temporär, Session 2026-08-06): Container-ENV vs GH-Secret (sha256) + echte HTTP-API-Auth (/v1/models, Bearer). Keine Klartextwerte in Logs.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  # ── ADR-027: Tresor-Datei (Owner-only, laeuft nur mit bitwarden_secret=write|delete) ──
  bitwarden-secret:
    name: "Bitwarden-Secret-Datei (${{ inputs.bitwarden_secret }}, target: ${{ inputs.target }})"
    if: inputs.bitwarden_secret != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: oc-bitwarden-${{ inputs.target }}
    env:
      VPS_USER: ${{ secrets.VPS_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      ENV_FILE: /etc/ia4/oc-bitwarden.env
    steps:
      - name: Vorbedingungen pruefen (Secrets vorhanden, Werte nicht ausgeben)
        env:
          BW_CLIENTID: ${{ secrets.BW_CLIENTID }}
          BW_CLIENTSECRET: ${{ secrets.BW_CLIENTSECRET }}
          BW_PASSWORD: ${{ secrets.BW_PASSWORD }}
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          TS_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
        run: |
          FAIL=0
          [ -n "$SSH_KEY" ] || { echo "❌ Secret SSH_KEY fehlt"; FAIL=1; }
          [ -n "$VPS_USER" ] || { echo "❌ Secret VPS_USER fehlt"; FAIL=1; }
          [ -n "$TS_CLIENT_ID" ] || { echo "❌ Secret TAILSCALE_OAUTH_CLIENT_ID fehlt"; FAIL=1; }
          [ -n "$TS_CLIENT_SECRET" ] || { echo "❌ Secret TAILSCALE_OAUTH_CLIENT_SECRET fehlt"; FAIL=1; }
          [ -n "$TS_TAILNET" ] || { echo "❌ Secret TAILSCALE_TAILNET fehlt"; FAIL=1; }
          if [ "${{ inputs.bitwarden_secret }}" = "write" ]; then
            for v in BW_CLIENTID BW_CLIENTSECRET BW_PASSWORD; do
              eval "VAL=\$$v"
              [ -n "$VAL" ] || { echo "❌ Environment-Secret fuer $v fehlt (Environment oc-bitwarden-${{ inputs.target }})"; FAIL=1; continue; }
              # env_file-Format: Wert in einfachen Anfuehrungszeichen (literal, keine Interpolation)
              case "$VAL" in
                *"'"*) echo "❌ $v enthaelt ein einfaches Anfuehrungszeichen – im env_file nicht darstellbar"; FAIL=1 ;;
              esac
              if [ "$(printf '%s' "$VAL" | wc -l)" -ne 0 ]; then
                echo "❌ $v enthaelt einen Zeilenumbruch"; FAIL=1
              fi
            done
          fi
          [ "$FAIL" -eq 0 ] || { echo "❌ Vorbedingungen nicht erfuellt – Abbruch"; exit 1; }
          echo "✅ Vorbedingungen ok (bitwarden_secret=${{ inputs.bitwarden_secret }})"

      - name: Connect Runner to Tailnet (MagicDNS)
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci,tag:ia4

      - name: Netmap-Sync abwarten
        run: sleep 15

      - name: VPS Tailscale-IP ermitteln (Tailscale-API)
        env:
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          TS_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
        run: |
          set -euo pipefail
          TS_TOKEN=$(curl -s --max-time 30 --data-urlencode "client_id=$TS_CLIENT_ID" \
            --data-urlencode "client_secret=$TS_CLIENT_SECRET" \
            "https://api.tailscale.com/api/v2/oauth/token" | jq -r '.access_token')
          echo "::add-mask::$TS_TOKEN"
          NODE="vps-${{ inputs.target }}"
          TS_IP=$(curl -sS "https://api.tailscale.com/api/v2/tailnet/${TS_TAILNET}/devices?fields=hostname,addresses" \
            -H "Authorization: Bearer ${TS_TOKEN}" \
            | jq -r --arg n "$NODE" '[.devices[] | select(.hostname == $n or .hostname == ($n + "-1"))] | sort_by(.lastSeen // "") | reverse | .[0].addresses[0] // empty' | head -1)
          [ -n "$TS_IP" ] && [ "$TS_IP" != "null" ] || { echo "❌ Keine Tailscale-IP für Node ${NODE}"; exit 1; }
          echo "VPS_TS_IP=${TS_IP}" >> "$GITHUB_ENV"
          echo "✅ Node ${NODE} → ${TS_IP}"

      - name: SSH-Key vorbereiten
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_TS_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Secret-Datei schreiben (root, 0600; Werte nur ueber stdin, nie als Argument)
        if: inputs.bitwarden_secret == 'write'
        env:
          BW_CLIENTID: ${{ secrets.BW_CLIENTID }}
          BW_CLIENTSECRET: ${{ secrets.BW_CLIENTSECRET }}
          BW_PASSWORD: ${{ secrets.BW_PASSWORD }}
        run: |
          set -euo pipefail
          printf "BW_CLIENTID='%s'\nBW_CLIENTSECRET='%s'\nBW_PASSWORD='%s'\n" \
            "$BW_CLIENTID" "$BW_CLIENTSECRET" "$BW_PASSWORD" \
          | ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o LogLevel=ERROR \
              "$VPS_USER@$VPS_TS_IP" \
              "sudo install -d -m 0700 -o root -g root /etc/ia4 \
               && sudo sh -c 'umask 077; cat > ${ENV_FILE}.tmp && chown root:root ${ENV_FILE}.tmp && chmod 0600 ${ENV_FILE}.tmp && mv ${ENV_FILE}.tmp ${ENV_FILE}'"
          ssh -o ConnectTimeout=10 -o LogLevel=ERROR "$VPS_USER@$VPS_TS_IP" \
            "sudo stat -c '%U:%G %a %s Bytes' ${ENV_FILE}"
          echo "✅ Secret-Datei geschrieben. Der Deploy-Job dieses Laufs bindet sie ein (playbook=openclaw)."

      - name: Secret-Datei loeschen (Rueckbau)
        if: inputs.bitwarden_secret == 'delete'
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o LogLevel=ERROR \
            "$VPS_USER@$VPS_TS_IP" "sudo rm -f ${ENV_FILE} ${ENV_FILE}.tmp && echo geloescht"
          echo "✅ Secret-Datei entfernt. Der Deploy-Job dieses Laufs (playbook=openclaw) erstellt die Container ohne Zugangsdaten neu."

  service-deploy:
    name: "Service-Deploy (${{ inputs.playbook }}, target: ${{ inputs.target }})"
    needs: bitwarden-secret
    # laeuft auch, wenn der Tresor-Job uebersprungen wurde (bitwarden_secret=none)
    if: always() && (needs.bitwarden-secret.result == 'success' || needs.bitwarden-secret.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_USER: ${{ secrets.VPS_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      CODE_SERVER_PASSWORD: ${{ secrets.CODE_SERVER_PASSWORD }}
      CODE_SERVER_SUDO_PASSWORD: ${{ secrets.CODE_SERVER_SUDO_PASSWORD }}
      # MagicDNS-FQDN (R3): vps-<target>.<TAILSCALE_TAILNET> – group_vars/all.yml lookup('env')
      CODE_SERVER_HOSTNAME: vps-${{ inputs.target }}.${{ secrets.TAILSCALE_TAILNET }}
      DEV_DEEPSEEK_API_KEY: ${{ secrets.DEV_DEEPSEEK_API_KEY }}
      DEV_OPENROUTER_API_KEY: ${{ secrets.DEV_OPENROUTER_API_KEY }}
      DEV_OPENAI_API_KEY: ${{ secrets.DEV_OPENAI_API_KEY }}
      DEV_GOOGLE_API_KEY: ${{ secrets.DEV_GOOGLE_API_KEY }}
      DEV_OC1_WEBSEARCH_API_KEY: ${{ secrets.DEV_OC1_WEBSEARCH_API_KEY }}
      DEV_OC1_GATEWAY_TOKEN: ${{ secrets.DEV_OC1_GATEWAY_TOKEN }}
      DEV_OC1_TELEGRAM_BOT_TOKEN: ${{ secrets.DEV_OC1_TELEGRAM_BOT_TOKEN }}
      DEV_OC2_WEBSEARCH_API_KEY: ${{ secrets.DEV_OC2_WEBSEARCH_API_KEY }}
      DEV_OC2_GATEWAY_TOKEN: ${{ secrets.DEV_OC2_GATEWAY_TOKEN }}
      DEV_OC2_TELEGRAM_BOT_TOKEN: ${{ secrets.DEV_OC2_TELEGRAM_BOT_TOKEN }}
      DEV_OC3_WEBSEARCH_API_KEY: ${{ secrets.DEV_OC3_WEBSEARCH_API_KEY }}
      DEV_OC3_GATEWAY_TOKEN: ${{ secrets.DEV_OC3_GATEWAY_TOKEN }}
      DEV_OC3_TELEGRAM_BOT_TOKEN: ${{ secrets.DEV_OC3_TELEGRAM_BOT_TOKEN }}
      DEV_OC1_GH_TOKEN: ${{ secrets.DEV_OC1_GH_TOKEN }}
      DEV_OC2_GH_TOKEN: ${{ secrets.DEV_OC2_GH_TOKEN }}
      DEV_OC3_GH_TOKEN: ${{ secrets.DEV_OC3_GH_TOKEN }}
      PROD_DEEPSEEK_API_KEY: ${{ secrets.PROD_DEEPSEEK_API_KEY }}
      PROD_OPENROUTER_API_KEY: ${{ secrets.PROD_OPENROUTER_API_KEY }}
      PROD_OPENAI_API_KEY: ${{ secrets.PROD_OPENAI_API_KEY }}
      PROD_GOOGLE_API_KEY: ${{ secrets.PROD_GOOGLE_API_KEY }}
      PROD_OC1_WEBSEARCH_API_KEY: ${{ secrets.PROD_OC1_WEBSEARCH_API_KEY }}
      PROD_OC1_GATEWAY_TOKEN: ${{ secrets.PROD_OC1_GATEWAY_TOKEN }}
      PROD_OC1_TELEGRAM_BOT_TOKEN: ${{ secrets.PROD_OC1_TELEGRAM_BOT_TOKEN }}
      PROD_OC2_WEBSEARCH_API_KEY: ${{ secrets.PROD_OC2_WEBSEARCH_API_KEY }}
      PROD_OC2_GATEWAY_TOKEN: ${{ secrets.PROD_OC2_GATEWAY_TOKEN }}
      PROD_OC2_TELEGRAM_BOT_TOKEN: ${{ secrets.PROD_OC2_TELEGRAM_BOT_TOKEN }}
      PROD_OC3_WEBSEARCH_API_KEY: ${{ secrets.PROD_OC3_WEBSEARCH_API_KEY }}
      PROD_OC3_GATEWAY_TOKEN: ${{ secrets.PROD_OC3_GATEWAY_TOKEN }}
      PROD_OC3_TELEGRAM_BOT_TOKEN: ${{ secrets.PROD_OC3_TELEGRAM_BOT_TOKEN }}
      PROD_OC1_GH_TOKEN: ${{ secrets.PROD_OC1_GH_TOKEN }}
      PROD_OC2_GH_TOKEN: ${{ secrets.PROD_OC2_GH_TOKEN }}
      PROD_OC3_GH_TOKEN: ${{ secrets.PROD_OC3_GH_TOKEN }}
      # Google-Drive-MCP (Issue #171): EIN gemeinsamer Secret-Satz (dediziertes Konto) fuer alle 6 Instanzen.
      # group_vars/all.yml liest sie via lookup('env'); NICHT pro Instanz/Provider-Block.
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_ACCESS_TOKEN: ${{ secrets.GDRIVE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Vorbedingungen prüfen (Secrets + Playbook-Selektion)
        env:
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          TS_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
        run: |
          FAIL=0
          [ -n "$SSH_KEY" ] || { echo "❌ Secret SSH_KEY fehlt"; FAIL=1; }
          [ -n "$VPS_USER" ] || { echo "❌ Secret VPS_USER fehlt"; FAIL=1; }
          [ -n "$TS_CLIENT_ID" ] || { echo "❌ Secret TAILSCALE_OAUTH_CLIENT_ID fehlt"; FAIL=1; }
          [ -n "$TS_CLIENT_SECRET" ] || { echo "❌ Secret TAILSCALE_OAUTH_CLIENT_SECRET fehlt"; FAIL=1; }
          [ -n "$TS_TAILNET" ] || { echo "❌ Secret TAILSCALE_TAILNET fehlt"; FAIL=1; }
          if [ "${{ inputs.playbook }}" = "services" ] && { [ -z "$CODE_SERVER_PASSWORD" ] || [ -z "$CODE_SERVER_SUDO_PASSWORD" ]; }; then
            echo "❌ Secrets CODE_SERVER_PASSWORD/CODE_SERVER_SUDO_PASSWORD fehlen (Pflicht für services-Lauf, K2-2)"
            FAIL=1
          fi
          if [ "${{ inputs.playbook }}" = "openclaw" ]; then
            T=$(echo "${{ inputs.target }}" | tr '[:lower:]' '[:upper:]')
            eval "KD=\$${T}_DEEPSEEK_API_KEY"; eval "KO=\$${T}_OPENROUTER_API_KEY"
            eval "KA=\$${T}_OPENAI_API_KEY";    eval "KG=\$${T}_GOOGLE_API_KEY"
            if [ -z "$KD" ] && [ -z "$KO" ] && [ -z "$KA" ] && [ -z "$KG" ]; then
              echo "❌ Kein LLM-Provider-Key für target=${T} gesetzt (${T}_DEEPSEEK|OPENROUTER|OPENAI|GOOGLE_API_KEY – mind. einer nötig; pro Instanz prüft die Rolle den aktiven Provider)"
              FAIL=1
            fi
          fi
          [ "$FAIL" -eq 0 ] || { echo "❌ Vorbedingungen nicht erfüllt – Abbruch"; exit 1; }

          # H1 (Issue #78-Review): Clean auf PROD erfordert explizites Human-Approval
          # (confirm_clean_prod=true, Harald-Entscheidung 2026-08-02). Das Gate liegt im
          # Playbook-Schritt; hier nur der Früh-Abbruch ohne Approval (verhindert unnötigen Tailnet-Aufbau).
          if [ "${{ inputs.clean }}" = "true" ] && [ "${{ inputs.target }}" = "prod" ] && [ "${{ inputs.confirm_clean_prod }}" != "true" ]; then
            echo "❌ clean-Modus auf PROD erfordert confirm_clean_prod=true (Human-Approval, destruktiv)"; exit 1
          fi
          echo "✅ Vorbedingungen ok"

      - name: Connect Runner to Tailnet (MagicDNS)
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci,tag:ia4

      - name: Netmap-Sync abwarten
        run: sleep 15

      - name: Tailscale OAuth-Token holen (IaC3-Verfahren)
        env:
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
        run: |
          TS_TOKEN=$(curl -s --max-time 30 --data-urlencode "client_id=$TS_CLIENT_ID" \
            --data-urlencode "client_secret=$TS_CLIENT_SECRET" \
            "https://api.tailscale.com/api/v2/oauth/token" | jq -r '.access_token')
          echo "TS_TOKEN=${TS_TOKEN}" >> $GITHUB_ENV

      - name: VPS Tailscale-IP ermitteln (Tailscale-API)
        env:
          TS_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
        run: |
          NODE="vps-${{ inputs.target }}"
          API_RESP=$(curl -sS -w "\nHTTP_CODE:%{http_code}" \
            "https://api.tailscale.com/api/v2/tailnet/${TS_TAILNET}/devices?fields=hostname,addresses" \
            -H "Authorization: Bearer ${TS_TOKEN}")
          HTTP_CODE=$(printf '%s' "$API_RESP" | tail -1 | cut -d: -f2)
          API_BODY=$(printf '%s' "$API_RESP" | sed '$d')
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ API-Fehler (HTTP ${HTTP_CODE}):"
            printf '%s\n' "$API_BODY" | head -5
            exit 1
          fi
          TS_IP=$(printf '%s' "$API_BODY" | jq -r --arg n "$NODE" '[.devices[] | select(.hostname == $n or .hostname == ($n + "-1"))] | sort_by(.lastSeen // "") | reverse | .[0].addresses[0] // empty' | head -1)
          if [ -z "$TS_IP" ] || [ "$TS_IP" = "null" ]; then
            echo "❌ Keine Tailscale-IP für Node ${NODE} – Workflow 02/03 müssen zuerst laufen"
            exit 1
          fi
          echo "VPS_TS_IP=${TS_IP}" >> $GITHUB_ENV
          echo "✅ Node ${NODE} → ${TS_IP}"

      - name: SSH-Key vorbereiten
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_TS_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ansible installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ansible

      - name: Ansible-Collections installieren (requirements.yml, K3-4)
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Inventory-Datei erstellen (MagicDNS) + group_vars bereitstellen
        run: |
          echo "[vps]" > /tmp/inventory
          echo "vps-${{ inputs.target }} ansible_host=$VPS_TS_IP ansible_user=$VPS_USER" >> /tmp/inventory
          # group_vars werden von Ansible NUR inventory-adjacent geladen -> /tmp/group_vars spiegeln
          mkdir -p /tmp/group_vars
          cp ansible/group_vars/all.yml /tmp/group_vars/all.yml
          # Ansible lädt group_vars/<GRUPPENNAME>.yml (Gruppe [vps]) – NICHT <hostname>.yml
          cp ansible/group_vars/vps-${{ inputs.target }}.yml /tmp/group_vars/vps.yml
          cat /tmp/inventory

      - name: Service-Playbook ausführen (${{ inputs.playbook }})
        working-directory: ansible
        run: |
          case "${{ inputs.playbook }}" in
            docker-traefik) PB="03-docker-traefik.yml" ;;
            services)       PB="04-services.yml" ;;
            openclaw) PB="05-openclaw.yml" ;;
          *) echo "❌ Unbekanntes Playbook"; exit 1 ;;
          esac
          echo "▶️  Playbook: $PB (target: ${{ inputs.target }})"

          # HUMAN-APPROVAL-Gate (Issue #78, Harald 2026-08-02): Clean auf PROD zulässig,
          # aber NUR mit expliziter Bestätigung confirm_clean_prod=true.
          if [ "${{ inputs.clean }}" = "true" ] && [ "${{ inputs.target }}" = "prod" ] && [ "${{ inputs.confirm_clean_prod }}" != "true" ]; then
            echo "❌ CLEAN auf PROD ist destruktiv (Sessions/QMD/State/Workspace aller Instanzen)."
            echo "   Human-Approval erforderlich: confirm_clean_prod=true setzen (Freigabe Harald)."
            exit 1
          fi
          if [ "${{ inputs.clean }}" = "true" ]; then
            echo "⚠️  CLEAN-Modus aktiv: Persistenz-State wird gelöscht (target: ${{ inputs.target }})."
          fi

          ansible-playbook "playbooks/$PB" -i /tmp/inventory -e openclaw_instance_filter=${{ inputs.instance }}${{ inputs.playbook == 'openclaw' && inputs.skip_bootstrap == 'true' && ' -e skip_bootstrap=true' || '' }}${{ inputs.playbook == 'openclaw' && inputs.clean == 'true' && ' -e openclaw_clean=true' || '' }}

      - name: Post-Deploy Check (SSH via Tailscale)
        run: |
          echo "✅ Service-Deploy abgeschlossen (${{ inputs.playbook }})"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
              "$VPS_USER@$VPS_TS_IP" \
              "docker ps --format '{{.Names}}: {{.Status}}' | grep -E 'traefik|ollama|openclaw|code-server' || true"
          echo ""
          echo "▶️  Nächster Schritt: Workflow 04-bdd-tests.yml (BDD-Verifikation, qa/bdd-testkonzept.md)"

      # ADR-027: Agenten-Tresor-Status je Instanz (nur Laengen/Versionen, keine Werte).
      # Zugangsdaten kommen aus der Host-Datei (Job bitwarden-secret oben, nur mit bitwarden_secret=write).
      - name: "Bitwarden-Verify (nur openclaw, ADR-027)"
        if: inputs.playbook == 'openclaw'
        run: |
          INSTS="${{ inputs.instance }}"
          [ "$INSTS" = "all" ] && INSTS="oc1 oc2 oc3"
          for i in $INSTS; do
            # Pruefskript per stdin in den Container (keine verschachtelten Quotes)
            R=$(ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o LogLevel=ERROR \
              "$VPS_USER@$VPS_TS_IP" "sudo docker exec -i openclaw-$i sh -s" 2>/dev/null <<'EOS'
          printf 'BW_CLIENTID=%s Zeichen, ' "$(printenv BW_CLIENTID | tr -d '\n' | wc -c)"
          if [ -x /opt/ia4-bitwarden/ia4-bw ]; then printf 'ia4-bw=ja, '; else printf 'ia4-bw=nein, '; fi
          printf 'bw=%s, ' "$(/opt/ia4-bitwarden/cli/bin/bw --version 2>/dev/null || echo fehlt)"
          if [ -f /home/node/.openclaw/skills/ia4-bitwarden/SKILL.md ]; then echo 'skill=ja'; else echo 'skill=nein'; fi
          EOS
            )
            echo "  openclaw-$i: ${R:-nicht erreichbar}"
          done

  # ── Temporäre Verifikation (Session 2026-08-06, Owner-Auftrag Gateway-Token-Verifikation) ──
  # Läuft NUR mit verify_token=true. Quellen: docs.openclaw.ai/gateway (Runbook) +
  # gateway/configuration-reference (gateway.auth.token; allowTailscale: HTTP-API nutzt
  # normalen Auth-Modus). Ports SSoT: ansible/group_vars/vps-prod.yml (oc1=18789, oc2=18790).
  # ACHTUNG Hash-Vergleich: printenv liefert "\n"-terminiert -> tr -d '\n' vor sha256sum,
  # sonst FALSE MISMATCH (Session-Befund 2026-08-06: sha256(TOKEN\n) != sha256(TOKEN)).
  gateway-token-verify:
    name: "Gateway-Token-Verify (target: ${{ inputs.target }}, ${{ inputs.instance }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: service-deploy
    if: inputs.verify_token == 'true'
    env:
      VPS_USER: ${{ secrets.VPS_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
      TS_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
      TARGET: ${{ inputs.target }}
      INSTANCE: ${{ inputs.instance }}
    steps:
      - name: Connect Runner to Tailnet
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci,tag:ia4

      - name: VPS-IP + Instanz-Metadaten (Port/Secret-Hash) ermitteln
        env:
          SECRET_OC1: ${{ secrets.PROD_OC1_GATEWAY_TOKEN }}
          SECRET_OC2: ${{ secrets.PROD_OC2_GATEWAY_TOKEN }}
          SECRET_OC3: ${{ secrets.PROD_OC3_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          TS_TOKEN=$(curl -s --max-time 30 --data-urlencode "client_id=$TS_CLIENT_ID" \
            --data-urlencode "client_secret=$TS_CLIENT_SECRET" \
            "https://api.tailscale.com/api/v2/oauth/token" | jq -r '.access_token')
          echo "::add-mask::$TS_TOKEN"
          NODE="vps-$TARGET"
          TS_DEVICES=$(curl -sS "https://api.tailscale.com/api/v2/tailnet/$TS_TAILNET/devices?fields=hostname,name,addresses,lastSeen" \
            -H "Authorization: Bearer $TS_TOKEN")
          VPS_TS_IP=$(printf '%s' "$TS_DEVICES" | jq -r --arg n "$NODE" '[.devices[] | select(.hostname == $n)] | .[0].addresses[0]')
          # MagicDNS-FQDN (name) statt roher IP für HTTPS-Tests: Tailscale-Serve validiert SNI,
          # rohe IP -> curl exit 35 (TLS-Handshake-Abbruch, Session-Befund 2026-08-06 oc1+oc2)
          VPS_TS_HOST=$(printf '%s' "$TS_DEVICES" | jq -r --arg n "$NODE" '[.devices[] | select(.hostname == $n)] | .[0].name')
          [ -n "$VPS_TS_IP" ] && [ "$VPS_TS_IP" != "null" ] || { echo "❌ Keine Tailscale-IP für $NODE"; exit 1; }
          [ -n "$VPS_TS_HOST" ] && [ "$VPS_TS_HOST" != "null" ] || { echo "❌ Kein MagicDNS-FQDN für $NODE"; exit 1; }
          echo "VPS_TS_IP=$VPS_TS_IP" >> "$GITHUB_ENV"
          echo "VPS_TS_HOST=$VPS_TS_HOST" >> "$GITHUB_ENV"
          case "$INSTANCE" in
            oc1) PORT=18789; SECRET="$SECRET_OC1" ;;
            oc2) PORT=18790; SECRET="$SECRET_OC2" ;;
            oc3) PORT=18791; SECRET="$SECRET_OC3" ;;
            *) echo "❌ Unbekannte Instanz: $INSTANCE"; exit 1 ;;
          esac
          echo "PORT=$PORT" >> "$GITHUB_ENV"
          echo "SECRET_LEN=${#SECRET}" >> "$GITHUB_ENV"
          echo "SECRET_PREFIX=${SECRET:0:4}" >> "$GITHUB_ENV"
          echo "SECRET_SHA256=$(printf '%s' "$SECRET" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
          # Token-Wert selbst wird nie gespeichert/gedruckt (nur Länge/Prefix/Hash)

      - name: SSH-Key vorbereiten
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: "A) Container-ENV-Token vs GH-Secret (sha256, newline-normalisiert)"
        run: |
          set -euo pipefail
          CONTAINER_SHA=$(ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o LogLevel=ERROR \
            "$VPS_USER@$VPS_TS_IP" "sudo docker exec openclaw-$INSTANCE printenv OPENCLAW_GATEWAY_TOKEN | tr -d '\n' | sha256sum | cut -d' ' -f1")
          echo "container_env_sha256=$CONTAINER_SHA"
          echo "gh_secret_sha256=$SECRET_SHA256"
          if [ "$CONTAINER_SHA" = "$SECRET_SHA256" ]; then
            echo "✅ A: Container-ENV == GH-Secret (sha256=$SECRET_SHA256)"
            echo "A_RESULT=MATCH" >> "$GITHUB_ENV"
          else
            echo "⚠️ A: Container-ENV != GH-Secret (container=$CONTAINER_SHA secret=$SECRET_SHA256) – Info, kein Abbruch"
            echo "A_RESULT=MISMATCH" >> "$GITHUB_ENV"
          fi

      - name: "C) ECHTER AUTH-TEST: HTTP-API mit Bearer-Token -> 200 erwartet"
        env:
          SECRET_OC1: ${{ secrets.PROD_OC1_GATEWAY_TOKEN }}
          SECRET_OC2: ${{ secrets.PROD_OC2_GATEWAY_TOKEN }}
          SECRET_OC3: ${{ secrets.PROD_OC3_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          case "$INSTANCE" in oc1) SECRET="$SECRET_OC1";; oc2) SECRET="$SECRET_OC2";; oc3) SECRET="$SECRET_OC3";; esac
          echo "::add-mask::$SECRET"
          CODE=$(curl -sk -o /tmp/models.json -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $SECRET" "https://$VPS_TS_HOST:$PORT/v1/models")
          echo "GET /v1/models (Bearer): HTTP $CODE"
          echo "AUTH_CODE=$CODE" >> "$GITHUB_ENV"
          if [ "$CODE" = "200" ]; then
            echo "✅ C: Token VALIDE – Authentifizierung erfolgreich (Header: Authorization: Bearer)"
            jq -c '{model_ids: [.data[].id], count: (.data | length)}' /tmp/models.json 2>/dev/null || head -c 400 /tmp/models.json
          else
            echo "❌ C: Bearer-Auth fehlgeschlagen (HTTP $CODE), Fallback-Header-Test:"
            CODE2=$(curl -sk -o /tmp/models2.json -w '%{http_code}' --max-time 20 \
              -H "x-openclaw-token: $SECRET" "https://$VPS_TS_HOST:$PORT/v1/models")
            echo "GET /v1/models (x-openclaw-token): HTTP $CODE2"
            echo "AUTH_CODE=$CODE2" >> "$GITHUB_ENV"
            if [ "$CODE2" = "200" ]; then
              echo "✅ C: Token VALIDE (Header: x-openclaw-token)"
              jq -c '{model_ids: [.data[].id], count: (.data | length)}' /tmp/models2.json 2>/dev/null || head -c 400 /tmp/models2.json
            else
              head -c 300 /tmp/models.json || true
            fi
          fi

      - name: "B) HTTP-API ohne Token -> 401/403/429 erwartet (Auth aktiv)"
        run: |
          set -euo pipefail
          CODE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 "https://$VPS_TS_HOST:$PORT/v1/models")
          echo "GET https://$VPS_TS_HOST:$PORT/v1/models (ohne Token): HTTP $CODE"
          case "$CODE" in
            401|403) echo "✅ B: Auth aktiv (HTTP $CODE ohne Token)" ;;
            429) echo "✅ B: Auth aktiv (HTTP 429 = Rate-Limiter, Auth erforderlich)" ;;
            *) echo "⚠️ B: Unerwartet HTTP $CODE ohne Token (Info)" ;;
          esac

      - name: "D) /health ohne Auth (Erreichbarkeit)"
        run: |
          set -euo pipefail
          CODE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 "https://$VPS_TS_HOST:$PORT/health")
          echo "GET /health: HTTP $CODE"
          [ "$CODE" = "200" ] && echo "✅ D: Gateway erreichbar" || echo "⚠️ D: /health lieferte HTTP $CODE (nicht kritisch für Token-Validität)"

      - name: "E) Diagnose: Container-Created, Env, Compose-Datei, Config-Token (nur Hashes)"
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o LogLevel=ERROR $VPS_USER@$VPS_TS_IP"
          echo "container_created=$($SSH "sudo docker inspect openclaw-$INSTANCE --format '{{.Created}}' 2>/dev/null")"
          echo "container_inspect_env_sha256=$($SSH "sudo docker inspect openclaw-$INSTANCE --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep '^OPENCLAW_GATEWAY_TOKEN=' | cut -d= -f2- | tr -d '\n' | sha256sum | cut -d' ' -f1")"
          echo "compose_file_sha256=$($SSH "sudo sha256sum /srv/openclaw/$INSTANCE/docker-compose.yml 2>/dev/null | cut -d' ' -f1")"
          echo "config_get_token_sha256=$($SSH "sudo docker exec openclaw-$INSTANCE openclaw config get gateway.auth.token 2>/dev/null | tr -d '\n' | sha256sum | cut -d' ' -f1")"
          echo "gateway_status=$($SSH "sudo docker exec openclaw-$INSTANCE openclaw gateway status 2>/dev/null | head -4 | tr '\n' ' ' | cut -c1-300")"

      - name: "F) Auswertung (Gate: AUTH_CODE == 200)"
        run: |
          set -euo pipefail
          echo "A_RESULT=$A_RESULT"
          echo "AUTH_CODE=$AUTH_CODE"
          echo "SECRET_LEN=$SECRET_LEN SECRET_PREFIX=$SECRET_PREFIX SECRET_SHA256=$SECRET_SHA256"
          if [ "${AUTH_CODE:-}" = "200" ]; then
            echo "✅ ERFOLG: Gateway-Token für $INSTANCE ist VALIDE (echte HTTP-API-Authentifizierung, Bearer-Header)"
          else
            echo "❌ FEHLER: Authentifizierung mit GH-Secret-Token fehlgeschlagen (HTTP ${AUTH_CODE:-n/a})"
            exit 1
          fi
