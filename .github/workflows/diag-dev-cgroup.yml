# =============================================================================
# Diag – Container-cgroup/OOM fuer npm rc=137 (read-only, NICHT fuer main)
#   Zweck: npm-Install im Container stirbt mit rc=137 (SIGKILL). Host-OOM ist
#   ausgeschlossen (5 GB frei, keine OOM-Historie). Klaert jetzt cgroup-Limit,
#   OOMKilled-Flag, Live-Stats und Container-Logs.
#   Trigger: push auf diesen Branch (workflow_dispatch erscheint nur auf main).
#   Keine Schreiboperation, kein Deploy.
# =============================================================================
name: "Diag – dev cgroup/137 (read-only)"

on:
  push:
    branches:
      - diag/dev-cgroup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_USER: ${{ secrets.VPS_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Connect Runner to Tailnet (MagicDNS)
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci,tag:ia4

      - name: Netmap-Sync abwarten
        run: sleep 15

      - name: Tailscale OAuth-Token holen
        env:
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          TS_TOKEN=$(curl -s --max-time 30 --data-urlencode "client_id=$TS_CLIENT_ID" \
            --data-urlencode "client_secret=$TS_CLIENT_SECRET" \
            "https://api.tailscale.com/api/v2/oauth/token" | jq -r ".access_token")
          echo "TS_TOKEN=$TS_TOKEN" >> "$GITHUB_ENV"

      - name: VPS Tailscale-IP ermitteln (vps-dev)
        env:
          TS_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
        run: |
          set -euo pipefail
          NODE="vps-dev"
          BODY=$(curl -sS "https://api.tailscale.com/api/v2/tailnet/${TS_TAILNET}/devices?fields=hostname,addresses" \
            -H "Authorization: Bearer $TS_TOKEN")
          TS_IP=$(printf "%s" "$BODY" | jq -r --arg n "$NODE" \
            "[.devices[] | select(.hostname == \$n or .hostname == (\$n + \"-1\"))] | sort_by(.lastSeen // \"\") | reverse | .[0].addresses[0] // empty" | head -1)
          [ -n "$TS_IP" ] && [ "$TS_IP" != "null" ] || { echo "FEHLER: Keine Tailscale-IP fuer $NODE"; exit 1; }
          echo "VPS_TS_IP=$TS_IP" >> "$GITHUB_ENV"
          echo "Node $NODE -> $TS_IP"

      - name: SSH-Key vorbereiten
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_TS_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: cgroup/OOM-Diagnose (read-only)
        run: |
          set +e -uo pipefail
          SSH="ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o LogLevel=ERROR $VPS_USER@$VPS_TS_IP"
          D="sudo -n docker"
          echo "===== HOST MEM (Gegenprobe) ====="
          $SSH "free -m" || echo "!! free fehlgeschlagen"
          for c in oc1 oc2 oc3; do
            N="openclaw-$c"
            echo "===== $N: STATE/OOMKilled ====="
            $SSH "$D inspect -f 'OOMKilled={{.State.OOMKilled}} Status={{.State.Status}} ExitCode={{.State.ExitCode}} Restarts={{.RestartCount}}' $N 2>&1" || echo "!! inspect fehlgeschlagen"
            echo "===== $N: HostConfig.Memory (Bytes) ====="
            $SSH "$D inspect -f 'Memory={{.HostConfig.Memory}} MemorySwap={{.HostConfig.MemorySwap}} MemoryReservation={{.HostConfig.MemoryReservation}} NanoCpus={{.HostConfig.NanoCpus}}' $N 2>&1" || echo "!! inspect fehlgeschlagen"
            echo "===== $N: Container-cgroup memory (v2/v1) ====="
            $SSH "$D exec $N sh -lc 'for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory/memory.limit_in_bytes /sys/fs/cgroup/memory/memory.max_usage_in_bytes; do [ -f \"\$f\" ] && echo \"\$f=\$(cat \$f)\"; done' 2>&1" || echo "!! exec fehlgeschlagen (Container evtl. im Restart-Loop)"
          done
          echo "===== docker stats --no-stream ====="
          $SSH "$D stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.CPUPerc}}' 2>&1" || echo "!! stats fehlgeschlagen"
          echo "===== docker ps -a ====="
          $SSH "$D ps -a --format '{{.Names}} {{.Image}} {{.Status}}' 2>&1" || echo "!! ps fehlgeschlagen"
          echo "===== LOGS oc1 (tail 60) ====="
          $SSH "$D logs --tail 60 openclaw-oc1 2>&1 | tail -60" || echo "!! logs fehlgeschlagen"
          echo "===== DIAG ENDE ====="
