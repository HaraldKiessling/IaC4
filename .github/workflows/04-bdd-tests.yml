---
# =============================================================================
# 04 – BDD-Tests (Post-Deploy-Verifikation)
#   Führt die BDD-Feature-Skripte (scripts/bdd/*.bdd.ps1) gegen einen Ziel-VPS
#   aus. Läuft über Tailscale (Runner joint das Tailnet mit tag:ci).
#   Testkatalog: qa/bdd-testkonzept.md
#   Fehlschlag ist erwünscht als Evidenz (rot = Lücke im Deploy oder im Test).
# =============================================================================
name: "04 – BDD-Tests (Post-Deploy-Verifikation)"

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Ziel-VPS'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

jobs:
  bdd:
    name: "BDD-Tests (target: ${{ inputs.target }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_USER: ${{ secrets.VPS_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      TS_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
      TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Connect Runner to Tailnet (MagicDNS)
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci,tag:ia4

      - name: Netmap-Sync abwarten
        run: sleep 15

      - name: Tailscale OAuth-Token holen (IaC3-Verfahren)
        run: |
          TS_TOKEN=$(curl -s --max-time 30 --data-urlencode "client_id=$TS_CLIENT_ID" \
            --data-urlencode "client_secret=$TS_CLIENT_SECRET" \
            "https://api.tailscale.com/api/v2/oauth/token" | jq -r '.access_token')
          echo "TS_TOKEN=${TS_TOKEN}" >> $GITHUB_ENV

      - name: VPS Tailscale-IP ermitteln (Tailscale-API)
        run: |
          NODE="vps-${{ inputs.target }}"
          API_RESP=$(curl -sS -w "\nHTTP_CODE:%{http_code}" \
            "https://api.tailscale.com/api/v2/tailnet/${TS_TAILNET}/devices?fields=hostname,addresses,lastSeen" \
            -H "Authorization: Bearer ${TS_TOKEN}")
          HTTP_CODE=$(printf '%s' "$API_RESP" | tail -1 | cut -d: -f2)
          API_BODY=$(printf '%s' "$API_RESP" | sed '$d')
          echo "🔎 Tailscale-API (IP-Ermittlung): HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ API-Fehler (HTTP ${HTTP_CODE}):"
            printf '%s\n' "$API_BODY" | head -5
            exit 1
          fi
          TS_IP=$(printf '%s' "$API_BODY" | jq -r --arg n "$NODE" '[.devices[] | select(.hostname == $n or .hostname == ($n + "-1"))] | sort_by(.lastSeen // "") | reverse | .[0].addresses[0] // empty' | head -1)
          if [ -z "$TS_IP" ] || [ "$TS_IP" = "null" ]; then
            echo "❌ Keine Tailscale-IP für Node ${NODE} gefunden – Workflow 02 muss zuerst laufen"
            exit 1
          fi
          echo "VPS_TS_IP=${TS_IP}" >> $GITHUB_ENV
          echo "✅ Node ${NODE} → ${TS_IP}"

      - name: Public-IP je Target setzen (mit Leer-Check)
        run: |
          if [ "${{ inputs.target }}" = "dev" ]; then
            PUB="${{ secrets.VPS_DEV_PUBLIC_IP }}"
          else
            PUB="${{ secrets.VPS_PROD_PUBLIC_IP }}"
          fi
          if [ -z "$PUB" ] || [ "$PUB" = "1.2.3.4" ]; then
            echo "❌ Public-IP für target=${{ inputs.target }} fehlt oder ist Platzhalter – T2 (Public-SSH dicht) wäre ein False-Positive"
            exit 1
          fi
          echo "PUBLIC_IP=${PUB}" >> $GITHUB_ENV

      - name: SSH-Key vorbereiten
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: BDD-Tests ausführen (pwsh)
        env:
          VPS_IP: ${{ env.VPS_TS_IP }}
          PUBLIC_IP: ${{ env.PUBLIC_IP }}
        run: |
          pwsh -NoProfile -File scripts/bdd/run-all.ps1 \
            -VpsIp "$VPS_IP" \
            -VpsUser "$VPS_USER" \
            -SshKeyPath ~/.ssh/id_ed25519 \
            -PublicIp "$PUBLIC_IP" \
            -ExpectedHostname "vps-${{ inputs.target }}" \
            -Instances "${{ inputs.target == 'dev' && 'oc1,oc2,oc3' || 'oc1,oc2' }}" \
            -DisabledInstances "${{ inputs.target == 'dev' && '' || 'oc3' }}"
